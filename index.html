<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e293b">
  <title>Campus Flow | Student Tracking & Roster Management</title>
  
  <!-- PWA Web Manifest & Favicon -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="brand">
      <span class="logo-icon" aria-hidden="true">🎓</span>
      <h1>CAMPUS FLOW</h1>
    </div>
    
    <!-- Navigation Menu Bar -->
    <nav class="main-nav">
      <ul>
        <li><a href="#dashboard" class="nav-link active">Dashboard</a></li>
        <li><a href="#roster" class="nav-link">Active Roster</a></li>
        <li><a href="#archives" class="nav-link">Graduates & Transcripts</a></li>
        <li><a href="#scanner" class="nav-link">ID Check-In</a></li>
      </ul>
    </nav>

    <div class="system-status">
      <span class="status-dot online"></span>
      <span>SYSTEM ONLINE</span>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="app-container">
    
    <!-- Key Metrics Dashboard -->
    <section class="metrics-grid">
      <div class="metric-card">
        <span class="card-icon" aria-hidden="true">👥</span>
        <div>
          <h3 id="total-students-count">0</h3>
          <p>Total Students</p>
        </div>
      </div>

      <div class="metric-card">
        <span class="card-icon" aria-hidden="true">✓</span>
        <div>
          <h3 id="on-campus-count">0</h3>
          <p>On Campus</p>
        </div>
      </div>

      <div class="metric-card">
        <span class="card-icon" aria-hidden="true">⇄</span>
        <div>
          <h3 id="movement-count">0</h3>
          <p>Movement Today</p>
        </div>
      </div>
    </section>

    <!-- Quick Action Controls -->
    <section class="quick-actions">
      <h2><span aria-hidden="true">⚡</span> Quick Actions</h2>
      <div class="action-buttons">
        <button id="btn-add-student" class="btn btn-primary">+ Add New Student</button>
        <button id="btn-batch-graduate" class="btn btn-secondary">🎓 End-of-Year Graduation</button>
      </div>
    </section>

    <!-- Active Roster Section -->
    <section id="roster" class="roster-section">
      <div class="section-header">
        <h2><span aria-hidden="true">👥</span> Active Student Roster</h2>
        <input type="search" id="roster-search" placeholder="Search by name or ID..." class="search-input">
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Grade</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="active-roster-body">
          <!-- Dynamically populated via students.js -->
        </tbody>
      </table>
    </section>

  </main>

  <!-- Add Student Modal -->
  <dialog id="add-student-modal" class="app-modal">
    <form id="add-student-form" method="dialog">
      <h2>Add New Student</h2>
      <label>
        Full Name
        <input type="text" id="student-name" required>
      </label>
      <label>
        Student ID
        <input type="text" id="student-id" required>
      </label>
      <label>
        Grade Level
        <select id="student-grade">
          <option value="9">Grade 9</option>
          <option value="10">Grade 10</option>
          <option value="11">Grade 11</option>
          <option value="12">Grade 12</option>
        </select>
      </label>
      <menu class="modal-actions">
        <button type="button" id="modal-cancel" class="btn btn-secondary">Cancel</button>
        <button type="submit" value="default" class="btn btn-primary">Save Student</button>
      </menu>
    </form>
  </dialog>

  <!-- JavaScript Modules -->
  <script src="students.js"></script>
  <script src="js/archive.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
