<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <meta name="theme-color" content="#0b0f14">

  <title>Campus Flow</title>

  <style>
    :root {
      --bg: #0b0f14;
      --card: #171d24;
      --card2: #242c37;
      --border: #2d3743;
      --text: #f4f6f8;
      --muted: #a5afbb;
      --green: #0d3424;
      --green-border: #167548;
      --blue: #142b43;
      --blue-border: #2676bd;
      --orange: #3a2915;
      --orange-border: #b87820;
      --button: #f4f5f6;
      --button-text: #14191f;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
    }

    body {
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-bottom: 1px solid #171b20;
    }

    header h1 {
      margin: 0;
      font-size: 29px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    main {
      width: min(920px, calc(100% - 28px));
      margin: 18px auto 40px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      min-height: 101px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stat-number {
      font-size: 35px;
      line-height: 1;
      font-weight: 800;
    }

    .stat-label {
      margin-top: 9px;
      color: var(--muted);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .4px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 13px;
      margin: 0 0 22px;
      font-size: 25px;
      font-weight: 800;
    }

    .section-title::before {
      content: "";
      width: 5px;
      height: 29px;
      border-radius: 5px;
      background: var(--text);
      flex-shrink: 0;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 13px;
      min-height: 61px;
      padding: 14px 18px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
    }

    button:active {
      transform: scale(.985);
    }

    .primary-btn {
      background: var(--button);
      color: var(--button-text);
    }

    .secondary-btn {
      background: var(--card2);
      color: var(--text);
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 18px;
      font-weight: 700;
    }

    .input-row {
      position: relative;
    }

    input {
      width: 100%;
      height: 63px;
      padding: 0 55px 0 17px;
      border-radius: 13px;
      border: 1px solid #3b4652;
      background: #0f141a;
      color: var(--text);
      font-size: 21px;
      font-family: inherit;
      outline: none;
    }

    input:focus {
      border-color: #7d8996;
    }

    .scan-icon {
      position: absolute;
      right: 17px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 24px;
      pointer-events: none;
    }

    .help-text {
      color: var(--muted);
      margin: 10px 0 20px;
      font-size: 17px;
    }

    .student-card {
      margin-top: 20px;
      border: 1px solid var(--green-border);
      background: var(--green);
      border-radius: 17px;
      padding: 21px;
    }

    .student-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .avatar {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #f4f6f8;
      color: #182028;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .student-name {
      font-size: 24px;
      font-weight: 800;
    }

    .student-id {
      margin-top: 4px;
      color: var(--muted);
      font-size: 17px;
      font-weight: 700;
    }

    .student-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 17px;
    }

    .info-box {
      border: 1px solid #276c4b;
      border-radius: 13px;
      padding: 13px 15px;
    }

    .info-label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .7px;
    }

    .info-value {
      margin-top: 5px;
      font-size: 20px;
      font-weight: 800;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 39px;
      padding: 7px 15px;
      border-radius: 22px;
      margin-bottom: 20px;
      background: #aeb8c3;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
    }

    .status-on {
      background: var(--blue);
      border-color: var(--blue-border);
    }

    .status-on .status-pill {
      background: #287bc1;
    }

    .status-movement {
      background: var(--orange);
      border-color: var(--orange-border);
    }

    .status-movement .status-pill {
      background: #b87820;
    }

    .roster-item {
      min-height: 78px;
      padding: 15px 17px;
      background: var(--card2);
      border: 1px solid #303a46;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 10px;
    }

    .roster-name {
      font-size: 19px;
      font-weight: 800;
    }

    .roster-meta {
      color: var(--muted);
      margin-top: 4px;
      font-size: 16px;
    }

    .roster-status {
      color: var(--muted);
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 20px 0 5px;
    }

    .message {
      display: none;
      margin-top: 12px;
      padding: 13px;
      border-radius: 11px;
      background: #252d37;
      color: var(--muted);
      font-weight: 700;
    }

    @media (max-width: 650px) {
      main {
        width: calc(100% - 20px);
        margin-top: 12px;
      }

      .stats {
        gap: 8px;
      }

      .stat {
        min-height: 92px;
      }

      .stat-number {
        font-size: 30px;
      }

      .stat-label {
        font-size: 13px;
      }

      .panel {
        padding: 18px;
      }

      .quick-actions {
        grid-template-columns: 1fr;
      }

      .student-info {
        grid-template-columns: 1fr;
      }

      .roster-item {
        align-items: flex-start;
      }
    }

    @media (prefers-color-scheme: light) {
      /* Keep Campus Flow dark by design. */
    }
  </style>
</head>

<body>

<header>
  <h1>Campus Flow</h1>
</header>

<main>

  <!-- DASHBOARD -->
  <section class="stats">

    <div class="stat">
      <div class="stat-number" id="studentCount">0</div>
      <div class="stat-label">STUDENTS</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="onCampusCount">0</div>
      <div class="stat-label">ON CAMPUS</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="movementCount">0</div>
      <div class="stat-label">MOVEMENT</div>
    </div>

  </section>


  <!-- QUICK ACTIONS -->
  <section class="panel">

    <h2 class="section-title">Quick Actions</h2>

    <div class="quick-actions">
      <button
        class="primary-btn"
        id="scanButton"
        type="button"
      >
        SCAN ID CARD
      </button>

      <button
        class="secondary-btn"
        id="rosterButton"
        type="button"
      >
        STUDENT ROSTER
      </button>
    </div>

  </section>


  <!-- STUDENT LOOKUP -->
  <section class="panel" id="studentSection">

    <h2 class="section-title">Student ID</h2>

    <label for="studentId">
      Scan or Enter Student ID
    </label>

    <div class="input-row">
      <input
        id="studentId"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Enter Student ID"
      >
      <span class="scan-icon">▣</span>
    </div>

    <div class="help-text">
      Scan the student's ID card or enter the ID manually.
    </div>

    <button
      class="primary-btn"
      id="lookupButton"
      type="button"
      style="width:100%;"
    >
      LOOK UP STUDENT
    </button>

    <div
      id="message"
      class="message"
    ></div>

    <div
      id="studentCard"
      class="student-card"
      style="display:none;"
    >

      <div class="student-header">

        <div
          class="avatar"
          id="avatar"
        >
          JD
        </div>

        <div>
          <div
            class="student-name"
            id="studentName"
          >
            John Doe
          </div>

          <div
            class="student-id"
            id="displayStudentId"
          >
            ID: 100001
          </div>
        </div>

      </div>


      <div class="student-info">

        <div class="info-box">
          <div class="info-label">GRADE</div>
          <div
            class="info-value"
            id="studentGrade"
          >
            9
          </div>
        </div>

        <div class="info-box">
          <div class="info-label">STATUS</div>
          <div
            class="info-value"
            id="studentStatus"
          >
            OFF CAMPUS
          </div>
        </div>

      </div>


      <div
        class="status-pill"
        id="statusPill"
      >
        <span class="status-dot"></span>
        <span id="statusPillText">OFF CAMPUS</span>
      </div>


      <button
        class="primary-btn"
        id="changeStatusButton"
        type="button"
        style="width:100%;"
      >
        CHANGE STATUS
      </button>

    </div>

  </section>


  <!-- ROSTER -->
  <section
    class="panel"
    id="rosterSection"
  >

    <h2 class="section-title">Student Roster</h2>

    <div id="rosterList"></div>

  </section>

</main>


<!--
  STUDENT DATA
  Keep this line if you have students.js in the repository.
-->
<script src="./students.js"></script>

<script>

  /*
   * CAMPUS FLOW
   * Main application logic
   */

  const DEFAULT_STUDENTS = [
    {
      id: "100001",
      firstName: "John",
      lastName: "Doe",
      grade: "9",
      status: "OFF CAMPUS"
    }
  ];


  /*
   * Use students.js if it supplies a students array.
   * Otherwise use the built-in starter student.
   */

  let students = [];

  if (typeof window.students !== "undefined" && Array.isArray(window.students)) {
    students = window.students;
  } else if (
    typeof window.STUDENTS !== "undefined" &&
    Array.isArray(window.STUDENTS)
  ) {
    students = window.STUDENTS;
  } else {
    students = DEFAULT_STUDENTS;
  }


  /*
   * Normalize student records.
   */

  students = students.map(student => ({
    id: String(student.id ?? student.studentId ?? ""),
    firstName: student.firstName ?? student.first_name ?? "",
    lastName: student.lastName ?? student.last_name ?? "",
    grade: String(student.grade ?? ""),
    status: student.status ?? "OFF CAMPUS"
  }));


  /*
   * Restore saved statuses.
   */

  const savedStatuses =
    JSON.parse(localStorage.getItem("campusFlowStatuses") || "{}");

  students.forEach(student => {
    if (savedStatuses[student.id]) {
      student.status = savedStatuses[student.id];
    }
  });


  let selectedStudent = null;


  /*
   * DOM elements
   */

  const studentCount =
    document.getElementById("studentCount");

  const onCampusCount =
    document.getElementById("onCampusCount");

  const movementCount =
    document.getElementById("movementCount");

  const studentIdInput =
    document.getElementById("studentId");

  const lookupButton =
    document.getElementById("lookupButton");

  const scanButton =
    document.getElementById("scanButton");

  const rosterButton =
    document.getElementById("rosterButton");

  const studentCard =
    document.getElementById("studentCard");

  const studentName =
    document.getElementById("studentName");

  const displayStudentId =
    document.getElementById("displayStudentId");

  const studentGrade =
    document.getElementById("studentGrade");

  const studentStatus =
    document.getElementById("studentStatus");

  const avatar =
    document.getElementById("avatar");

  const statusPill =
    document.getElementById("statusPill");

  const statusPillText =
    document.getElementById("statusPillText");

  const changeStatusButton =
    document.getElementById("changeStatusButton");

  const rosterList =
    document.getElementById("rosterList");

  const rosterSection =
    document.getElementById("rosterSection");

  const message =
    document.getElementById("message");


  /*
   * Update dashboard counters.
   */

  function updateDashboard() {

    studentCount.textContent = students.length;

    onCampusCount.textContent =
      students.filter(
        student => student.status === "ON CAMPUS"
      ).length;

    movementCount.textContent =
      students.filter(
        student => student.status === "MOVEMENT"
      ).length;
  }


  /*
   * Save current student statuses.
   */

  function saveStatuses() {

    const statusData = {};

    students.forEach(student => {
      statusData[student.id] = student.status;
    });

    localStorage.setItem(
      "campusFlowStatuses",
      JSON.stringify(statusData)
    );
  }


  /*
   * Get initials.
   */

  function getInitials(student) {

    const first =
      student.firstName?.charAt(0) || "";

    const last =
      student.lastName?.charAt(0) || "";

    return (first + last).toUpperCase();
  }


  /*
   * Display selected student.
   */

  function displayStudent(student) {

    selectedStudent = student;

    studentName.textContent =
      `${student.firstName} ${student.lastName}`.trim();

    displayStudentId.textContent =
      `ID: ${student.id}`;

    studentGrade.textContent =
      student.grade || "—";

    studentStatus.textContent =
      student.status;

    avatar.textContent =
      getInitials(student);

    statusPillText.textContent =
      student.status;

    studentCard.style.display = "block";

    updateStatusAppearance(student.status);

    message.style.display = "none";
  }


  /*
   * Change the visual card according to status.
   */

  function updateStatusAppearance(status) {

    studentCard.classList.remove(
      "status-on",
      "status-movement"
    );

    if (status === "ON CAMPUS") {
      studentCard.classList.add("status-on");
    }

    if (status === "MOVEMENT") {
      studentCard.classList.add("status-movement");
    }
  }


  /*
   * Find student.
   */

  function lookupStudent() {

    const id =
      studentIdInput.value.trim();

    if (!id) {

      showMessage(
        "Enter or scan a student ID."
      );

      return;
    }

    const student =
      students.find(
        item => String(item.id) === String(id)
      );

    if (!student) {

      showMessage(
        `Student ID ${id} was not found.`
      );

      studentCard.style.display = "none";

      selectedStudent = null;

      return;
    }

    displayStudent(student);
  }


  /*
   * Status cycle:
   *
   * OFF CAMPUS
   *       ↓
   * ON CAMPUS
   *       ↓
   * MOVEMENT
   *       ↓
   * OFF CAMPUS
   */

  function changeStatus() {

    if (!selectedStudent) {
      return;
    }

    if (selectedStudent.status === "OFF CAMPUS") {

      selectedStudent.status =
        "ON CAMPUS";

    } else if (selectedStudent.status === "ON CAMPUS") {

      selectedStudent.status =
        "MOVEMENT";

    } else {

      selectedStudent.status =
        "OFF CAMPUS";
    }

    saveStatuses();

    displayStudent(selectedStudent);

    updateDashboard();

    renderRoster();
  }


  /*
   * Render student roster.
   */

  function renderRoster() {

    rosterList.innerHTML = "";

    if (!students.length) {

      rosterList.innerHTML =
        `<div class="empty">No students loaded.</div>`;

      return;
    }

    students.forEach(student => {

      const item =
        document.createElement("div");

      item.className =
        "roster-item";

      item.innerHTML = `
        <div>
          <div class="roster-name">
            ${escapeHtml(
              `${student.firstName} ${student.lastName}`.trim()
            )}
          </div>

          <div class="roster-meta">
            ${escapeHtml(student.id)}
            · Grade ${escapeHtml(student.grade || "—")}
          </div>
        </div>

        <div class="roster-status">
          ${escapeHtml(student.status)}
        </div>
      `;

      item.addEventListener(
        "click",
        () => {

          studentIdInput.value =
            student.id;

          displayStudent(student);

          document
            .getElementById("studentSection")
            .scrollIntoView({
              behavior: "smooth",
              block: "start"
            });
        }
      );

      rosterList.appendChild(item);
    });
  }


  /*
   * Message helper.
   */

  function showMessage(text) {

    message.textContent = text;

    message.style.display = "block";
  }


  /*
   * Basic HTML escaping.
   */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  /*
   * Scan button.
   *
   * On iPad/iPhone, this focuses the field so
   * a compatible ID scanner can enter the ID.
   */

  scanButton.addEventListener(
    "click",
    () => {

      studentIdInput.focus();

      studentIdInput.select();
    }
  );


  /*
   * Lookup.
   */

  lookupButton.addEventListener(
    "click",
    lookupStudent
  );


  /*
   * Allow scanner ENTER key to
   * automatically perform lookup.
   */

  studentIdInput.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        event.preventDefault();

        lookupStudent();
      }
    }
  );


  /*
   * Change status.
   */

  changeStatusButton.addEventListener(
    "click",
    changeStatus
  );


  /*
   * Student roster button.
   */

  rosterButton.addEventListener(
    "click",
    () => {

      rosterSection.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }
  );


  /*
   * Initial application load.
   */

  updateDashboard();

  renderRoster();

  /*
   * Automatically show the first student
   * when the app initially loads.
   */

  if (students.length > 0) {

    studentIdInput.value =
      students[0].id;

    displayStudent(students[0]);
  }

</script>

</body>
</html>
