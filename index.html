<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default"
>

<meta
  name="apple-mobile-web-app-title"
  content="Campus Flow"
>

<meta
  name="theme-color"
  content="#eef1f5"
  media="(prefers-color-scheme: light)"
>

<meta
  name="theme-color"
  content="#0b0f14"
  media="(prefers-color-scheme: dark)"
>

<title>Campus Flow</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  color-scheme:light dark;

  --bg:#eef1f5;
  --card:#ffffff;
  --border:#dfe3e8;
  --text:#17202a;
  --muted:#68727d;

  --input:#ffffff;
  --input-border:#c8ced6;

  --accent:#17202a;
  --accent-text:#ffffff;

  --secondary:#e5e8ec;
  --secondary-text:#17202a;

  --success:#16834b;
  --success-bg:#e8f6ee;
  --success-border:#bfe5ce;

  --danger:#c62828;
  --danger-bg:#fff0f0;
  --danger-border:#e3aaaa;

  --shadow:0 4px 18px rgba(15,23,42,.08);
}

html{
  background:var(--bg);
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--text);

  -webkit-font-smoothing:antialiased;
}

header{
  background:linear-gradient(
    180deg,
    #15191e 0%,
    #0b0d10 100%
  );

  color:#fff;

  padding:
    calc(18px + env(safe-area-inset-top))
    18px
    18px;

  text-align:center;

  font-size:23px;
  font-weight:800;

  box-shadow:
    0 2px 10px rgba(0,0,0,.18);
}

.app{
  width:min(760px,100%);
  margin:0 auto;

  padding:
    14px
    12px
    calc(45px + env(safe-area-inset-bottom));
}

/* DASHBOARD */

.dashboard{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  margin-bottom:16px;
}

.stat{
  background:var(--card);

  border:
    1px solid var(--border);

  border-radius:15px;

  padding:15px 10px;

  text-align:center;

  box-shadow:var(--shadow);
}

.stat-number{
  display:block;

  font-size:27px;
  font-weight:850;

  line-height:1;
}

.stat-label{
  display:block;

  margin-top:7px;

  color:var(--muted);

  font-size:12px;
  font-weight:700;

  text-transform:uppercase;
}

/* CARDS */

.card{
  background:var(--card);

  border:
    1px solid var(--border);

  border-radius:16px;

  padding:19px;

  margin-bottom:16px;

  box-shadow:var(--shadow);
}

.card h2{
  display:flex;
  align-items:center;

  gap:10px;

  margin:
    0
    0
    18px;

  font-size:20px;
  font-weight:800;
}

.card h2::before{
  content:"";

  width:4px;
  height:22px;

  border-radius:4px;

  background:var(--accent);
}

/* QUICK ACTIONS */

.quick-actions{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;
}

.quick-button{
  margin:0;

  min-height:56px;

  font-size:15px;
}

/* FORM */

label{
  display:block;

  margin:
    14px
    0
    7px;

  font-size:14px;
  font-weight:750;
}

input,
select{
  width:100%;

  min-height:50px;

  padding:
    13px
    14px;

  border:
    1px solid var(--input-border);

  border-radius:10px;

  background:var(--input);

  color:var(--text);

  font-family:inherit;
  font-size:17px;

  outline:none;
}

input:focus,
select:focus{
  border-color:#6b7280;

  box-shadow:
    0 0 0 3px
    rgba(107,114,128,.14);
}

input::placeholder{
  color:#8a939e;
}

/* SCANNER */

.id-entry{
  position:relative;
}

.id-entry input{
  padding-right:54px;
}

.scan-icon{
  position:absolute;

  right:14px;
  bottom:13px;

  font-size:22px;

  pointer-events:none;
}

.scan-hint{
  margin-top:8px;

  color:var(--muted);

  font-size:13px;

  line-height:1.4;
}

/* BUTTONS */

button{
  width:100%;

  border:0;

  border-radius:10px;

  min-height:50px;

  padding:
    13px
    16px;

  margin-top:17px;

  font-family:inherit;

  font-size:16px;
  font-weight:800;

  letter-spacing:.01em;

  cursor:pointer;

  background:var(--accent);
  color:var(--accent-text);

  box-shadow:
    0 2px 5px rgba(0,0,0,.12);

  -webkit-tap-highlight-color:
    transparent;

  transition:
    transform .08s ease,
    opacity .15s ease;
}

button:active{
  transform:scale(.985);
}

button.secondary{
  background:var(--secondary);
  color:var(--secondary-text);

  box-shadow:none;
}

/* STUDENT CARD */

.student-card{
  display:none;

  border:
    1px solid var(--success-border);

  background:var(--success-bg);

  border-radius:15px;

  padding:17px;

  margin-top:17px;
}

.student-card.show{
  display:block;

  animation:
    cardIn .2s ease-out;
}

@keyframes cardIn{

  from{
    opacity:0;
    transform:translateY(6px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.student-card-top{
  display:flex;

  align-items:center;

  gap:13px;
}

.student-avatar{
  width:50px;
  height:50px;

  flex:0 0 50px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:var(--accent);
  color:var(--accent-text);

  font-size:19px;
  font-weight:850;
}

.student-name{
  font-size:19px;
  font-weight:850;
}

.student-id{
  margin-top:3px;

  color:var(--muted);

  font-size:13px;
  font-weight:650;
}

.student-details{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  margin-top:15px;
}

.detail{
  background:rgba(255,255,255,.45);

  border:
    1px solid var(--success-border);

  border-radius:10px;

  padding:11px;
}

.detail-label{
  display:block;

  color:var(--muted);

  font-size:11px;

  font-weight:750;

  text-transform:uppercase;
}

.detail-value{
  display:block;

  margin-top:4px;

  font-size:16px;

  font-weight:800;
}

.status{
  display:inline-flex;

  align-items:center;

  gap:6px;

  margin-top:14px;

  padding:
    7px
    11px;

  border-radius:999px;

  background:var(--success);

  color:#fff;

  font-size:13px;
  font-weight:800;
}

/* UNKNOWN */

.message{
  display:none;

  margin-top:14px;

  padding:13px;

  border-radius:10px;

  font-size:14px;
  font-weight:700;

  line-height:1.4;
}

.message.show{
  display:block;
}

.message.error{
  background:var(--danger-bg);

  border:
    1px solid var(--danger-border);

  color:var(--danger);
}

/* ROSTER */

.roster-empty{
  color:var(--muted);

  text-align:center;

  padding:12px 5px;

  font-size:14px;
}

.roster-list{
  display:flex;

  flex-direction:column;

  gap:9px;
}

.roster-item{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  padding:12px;

  border:
    1px solid var(--border);

  border-radius:11px;

  background:var(--secondary);
}

.roster-name{
  font-weight:800;
  font-size:15px;
}

.roster-meta{
  margin-top:3px;

  color:var(--muted);

  font-size:12px;
}

.roster-status{
  flex:0 0 auto;

  padding:
    6px
    9px;

  border-radius:999px;

  font-size:11px;

  font-weight:800;
}

.roster-status.in{
  background:var(--success-bg);
  color:var(--success);
}

.roster-status.out{
  background:var(--secondary);
  color:var(--muted);
}

/* DARK MODE */

@media(prefers-color-scheme:dark){

  :root{
    --bg:#0b0f14;
    --card:#171d24;
    --border:#2b333d;

    --text:#f4f6f8;
    --muted:#a7b0ba;

    --input:#0f141a;
    --input-border:#3b4550;

    --accent:#f4f6f8;
    --accent-text:#11161c;

    --secondary:#242c35;
    --secondary-text:#f4f6f8;

    --success:#51d98c;
    --success-bg:#14291f;
    --success-border:#245b3c;

    --danger:#ff7474;
    --danger-bg:#321919;
    --danger-border:#693434;
  }

  html,
  body{
    background:#0b0f14;
  }

  header{
    background:#000;
  }

  .detail{
    background:#18251e;
  }

}

/* MOBILE */

@media(max-width:520px){

  .dashboard{
    gap:7px;
  }

  .stat{
    padding:
      14px
      7px;
  }

  .stat-number{
    font-size:24px;
  }

  .stat-label{
    font-size:10px;
  }

  .card{
    padding:17px;
  }

}

</style>
</head>

<body>

<header>
  Campus Flow
</header>

<main class="app">

  <!-- DASHBOARD -->

  <section class="dashboard">

    <div class="stat">
      <span
        class="stat-number"
        id="studentCount"
      >0</span>

      <span class="stat-label">
        Students
      </span>
    </div>

    <div class="stat">
      <span
        class="stat-number"
        id="campusCount"
      >0</span>

      <span class="stat-label">
        On Campus
      </span>
    </div>

    <div class="stat">
      <span
        class="stat-number"
        id="movementCount"
      >0</span>

      <span class="stat-label">
        Movement
      </span>
    </div>

  </section>


  <!-- QUICK ACTIONS -->

  <section class="card">

    <h2>
      Quick Actions
    </h2>

    <div class="quick-actions">

      <button
        class="quick-button"
        onclick="focusStudentId()"
      >
        SCAN ID CARD
      </button>

      <button
        class="quick-button secondary"
        onclick="showRoster()"
      >
        STUDENT ROSTER
      </button>

    </div>

  </section>


  <!-- STUDENT ID CARD -->

  <section class="card">

    <h2>
      Student ID
    </h2>

    <div class="id-entry">

      <label for="studentId">
        Scan or Enter Student ID
      </label>

      <input
        id="studentId"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        placeholder="Scan ID card..."
        enterkeyhint="done"
      >

      <span class="scan-icon">
        ▣
      </span>

    </div>

    <div class="scan-hint">
      Scan the student's ID card or enter the ID manually.
    </div>

    <button
      onclick="processStudentId()"
    >
      LOOK UP STUDENT
    </button>


    <!-- STUDENT RESULT -->

    <div
      class="student-card"
      id="studentCard"
    >

      <div class="student-card-top">

        <div
          class="student-avatar"
          id="studentAvatar"
        >
          ?
        </div>

        <div>

          <div
            class="student-name"
            id="studentName"
          >
            Student
          </div>

          <div
            class="student-id"
            id="studentIdDisplay"
          >
            ID
          </div>

        </div>

      </div>


      <div class="student-details">

        <div class="detail">

          <span class="detail-label">
            Grade
          </span>

          <span
            class="detail-value"
            id="studentGrade"
          >
            —
          </span>

        </div>

        <div class="detail">

          <span class="detail-label">
            Status
          </span>

          <span
            class="detail-value"
            id="studentStatusText"
          >
            —
          </span>

        </div>

      </div>


      <div
        class="status"
        id="studentStatus"
      >
        ● ON CAMPUS
      </div>


      <button
        onclick="toggleStudentStatus()"
      >
        CHANGE STATUS
      </button>

    </div>


    <div
      class="message error"
      id="errorMessage"
    >
    </div>

  </section>


  <!-- ROSTER -->

  <section
    class="card"
    id="rosterCard"
  >

    <h2>
      Student Roster
    </h2>

    <div
      class="roster-empty"
      id="rosterEmpty"
    >
      No students have been scanned yet.
    </div>

    <div
      class="roster-list"
      id="rosterList"
    ></div>

  </section>

</main>


<!-- STUDENT DATABASE -->

<script src="./students.js"></script>


<!-- CAMPUS FLOW APPLICATION -->

<script>

const STORAGE_KEY =
  "campusFlowStudents";

let students =
  loadStudents();

let activeStudentId =
  null;


/* -------------------------
   STORAGE
------------------------- */

function loadStudents(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!saved){
      return {};
    }

    return JSON.parse(saved);

  }catch(error){

    return {};

  }

}


function saveStudents(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(students)
  );

}


/* -------------------------
   DASHBOARD
------------------------- */

function updateDashboard(){

  const list =
    Object.values(students);

  const total =
    list.length;

  const onCampus =
    list.filter(
      student =>
        student.status ===
        "ON CAMPUS"
    ).length;

  document
    .getElementById(
      "studentCount"
    )
    .textContent =
      total;

  document
    .getElementById(
      "campusCount"
    )
    .textContent =
      onCampus;

}


/* -------------------------
   ID FIELD
------------------------- */

function focusStudentId(){

  const input =
    document.getElementById(
      "studentId"
    );

  input.focus();

  input.select();

}


document
  .getElementById("studentId")
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key ===
        "Enter"
      ){

        event.preventDefault();

        processStudentId();

      }

    }
  );


document
  .getElementById("studentId")
  .addEventListener(
    "input",
    function(){

      hideError();

    }
  );


/* -------------------------
   STUDENT LOOKUP
------------------------- */

function processStudentId(){

  const input =
    document.getElementById(
      "studentId"
    );

  const id =
    input.value
      .trim()
      .toUpperCase();


  if(!id){

    showError(
      "Please scan a student ID card or enter a student ID."
    );

    input.focus();

    return;

  }


  /*
    Look for the student in
    the Campus Flow database.
  */

  const databaseStudent =
    findStudentByCard(id);


  /*
    Unknown ID cards are NOT
    automatically added anymore.
  */

  if(!databaseStudent){

    showError(
      "STUDENT NOT FOUND — This ID card is not in the Campus Flow student database."
    );

    document
      .getElementById(
        "studentCard"
      )
      .classList.remove(
        "show"
      );

    activeStudentId =
      null;

    input.select();

    return;

  }


  /*
    If the student has not been
    scanned today, create the
    attendance record.
  */

  if(!students[id]){

    students[id] = {

      id:
        databaseStudent.id,

      name:
        getStudentName(
          databaseStudent
        ),

      grade:
        databaseStudent.grade,

      homeroom:
        databaseStudent.homeroom,

      status:
        "ON CAMPUS",

      lastScan:
        new Date().toISOString()

    };

  }else{

    /*
      Update the student information
      from the database in case it
      has changed.
    */

    students[id].name =
      getStudentName(
        databaseStudent
      );

    students[id].grade =
      databaseStudent.grade;

    students[id].homeroom =
      databaseStudent.homeroom;

  }


  activeStudentId =
    id;


  displayStudent(
    students[id]
  );


  saveStudents();

  updateDashboard();

  renderRoster();


  setTimeout(
    function(){

      input.select();

    },
    100
  );

}


/* -------------------------
   DISPLAY STUDENT
------------------------- */

function displayStudent(
  student
){

  const card =
    document.getElementById(
      "studentCard"
    );


  document
    .getElementById(
      "studentName"
    )
    .textContent =
      student.name;


  document
    .getElementById(
      "studentIdDisplay"
    )
    .textContent =
      "ID: " +
      student.id;


  document
    .getElementById(
      "studentGrade"
    )
    .textContent =
      student.grade;


  document
    .getElementById(
      "studentStatusText"
    )
    .textContent =
      student.status;


  const initials =
    getInitials(
      student.name
    );


  document
    .getElementById(
      "studentAvatar"
    )
    .textContent =
      initials;


  const status =
    document.getElementById(
      "studentStatus"
    );


  if(
    student.status ===
    "ON CAMPUS"
  ){

    status.textContent =
      "● ON CAMPUS";

    status.style.background =
      "var(--success)";

  }else{

    status.textContent =
      "● OFF CAMPUS";

    status.style.background =
      "var(--muted)";

  }


  card.classList.add(
    "show"
  );

  hideError();

}


/* -------------------------
   STATUS
------------------------- */

function toggleStudentStatus(){

  if(!activeStudentId){
    return;
  }


  const student =
    students[
      activeStudentId
    ];


  if(!student){
    return;
  }


  if(
    student.status ===
    "ON CAMPUS"
  ){

    student.status =
      "OFF CAMPUS";

  }else{

    student.status =
      "ON CAMPUS";

  }


  student.lastScan =
    new Date().toISOString();


  saveStudents();

  displayStudent(
    student
  );

  updateDashboard();

  renderRoster();

}


/* -------------------------
   ROSTER
------------------------- */

function renderRoster(){

  const list =
    document.getElementById(
      "rosterList"
    );

  const empty =
    document.getElementById(
      "rosterEmpty"
    );


  list.innerHTML =
    "";


  const roster =
    Object.values(students);


  if(
    roster.length ===
    0
  ){

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";


  roster.forEach(
    student => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "roster-item";


      const left =
        document.createElement(
          "div"
        );


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "roster-name";

      name.textContent =
        student.name;


      const meta =
        document.createElement(
          "div"
        );

      meta.className =
        "roster-meta";

      meta.textContent =
        student.id +
        " • Grade " +
        student.grade;


      left.appendChild(
        name
      );

      left.appendChild(
        meta
      );


      const status =
        document.createElement(
          "div"
        );

      status.className =
        "roster-status " +
        (
          student.status ===
          "ON CAMPUS"
            ? "in"
            : "out"
        );

      status.textContent =
        student.status;


      item.appendChild(
        left
      );

      item.appendChild(
        status
      );


      item.addEventListener(
        "click",
        function(){

          activeStudentId =
            student.id;

          displayStudent(
            student
          );

          document
            .getElementById(
              "studentId"
            )
            .value =
              student.id;

          window.scrollTo({
            top:0,
            behavior:"smooth"
          });

        }
      );


      list.appendChild(
        item
      );

    }
  );

}


/* -------------------------
   ROSTER BUTTON
------------------------- */

function showRoster(){

  const roster =
    document.getElementById(
      "rosterCard"
    );

  roster.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


/* -------------------------
   HELPERS
------------------------- */

function getInitials(
  name
){

  return name
    .split(" ")
    .filter(Boolean)
    .slice(0,2)
    .map(
      part =>
        part.charAt(0)
    )
    .join("")
    .toUpperCase();

}


function showError(
  message
){

  const box =
    document.getElementById(
      "errorMessage"
    );

  box.textContent =
    message;

  box.classList.add(
    "show"
  );

}


function hideError(){

  document
    .getElementById(
      "errorMessage"
    )
    .classList.remove(
      "show"
    );

}


/* -------------------------
   STARTUP
------------------------- */

updateDashboard();

renderRoster();


window.addEventListener(
  "load",
  function(){

    setTimeout(
      focusStudentId,
      250
    );

  }
);

</script>

</body>
</html>
