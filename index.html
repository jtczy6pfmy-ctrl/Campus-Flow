<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#070b11">

  <title>Campus Flow</title>

  <style>
    :root {
      --bg: #070b11;
      --bg2: #0b111a;
      --header: #030507;

      --card: #111a27;
      --card2: #172235;
      --card3: #1b2a40;

      --border: #263752;
      --border-light: #304562;

      --text: #f5f7fb;
      --muted: #9ba8bb;
      --muted2: #718096;

      --blue: #087cff;
      --blue2: #126cff;
      --blue-dark: #10294b;

      --green: #35ef78;
      --green-dark: #103c27;
      --green-border: #167341;

      --orange: #ff9817;
      --orange-dark: #3b2915;

      --purple: #8b45ff;

      --button-text: #ffffff;

      --shadow:
        0 12px 30px rgba(0, 0, 0, .22);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100%;
      padding-bottom: env(safe-area-inset-bottom);

      background:
        radial-gradient(
          circle at top center,
          #101b2a 0%,
          var(--bg) 42%
        );

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    button:active {
      transform: scale(.985);
    }

    /* =========================================================
       HEADER
       ========================================================= */

    header {
      height: 82px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        0
        max(28px, env(safe-area-inset-right))
        0
        max(28px, env(safe-area-inset-left));

      background: rgba(2, 4, 7, .97);

      border-bottom: 1px solid #141b25;

      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-icon {
      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 36px;
      line-height: 1;
    }

    .brand-title {
      margin: 0;

      font-size: 30px;
      line-height: 1;

      font-weight: 850;
      letter-spacing: -.7px;
    }

    .system-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 8px 14px;

      border-radius: 20px;

      background: #07331c;
      border: 1px solid #0d7135;

      color: #55f58a;

      font-size: 14px;
      font-weight: 800;

      white-space: nowrap;
    }

    .system-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #38f179;

      box-shadow: 0 0 10px rgba(56, 241, 121, .7);
    }

    /* =========================================================
       MAIN
       ========================================================= */

    main {
      width: min(1380px, calc(100% - 56px));
      margin: 22px auto 50px;
    }

    /* =========================================================
       DASHBOARD STATS
       ========================================================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;

      margin-bottom: 22px;
    }

    .stat {
      min-height: 106px;

      display: flex;
      align-items: center;

      padding: 22px 28px;

      background:
        linear-gradient(
          145deg,
          #152135,
          #101925
        );

      border: 1px solid var(--border);
      border-radius: 21px;

      box-shadow: var(--shadow);
    }

    .stat-icon {
      width: 55px;
      height: 55px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-right: 20px;

      font-size: 38px;
      line-height: 1;
    }

    .stat-icon.purple {
      color: var(--purple);
    }

    .stat-icon.green {
      color: var(--green);
    }

    .stat-icon.orange {
      color: var(--orange);
    }

    .stat-content {
      display: flex;
      flex-direction: column;
    }

    .stat-number {
      font-size: 38px;
      line-height: 1;

      font-weight: 850;
      letter-spacing: -.8px;
    }

    .stat-label {
      margin-top: 7px;

      color: var(--muted);

      font-size: 16px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    /* =========================================================
       PANELS
       ========================================================= */

    .panel {
      background:
        linear-gradient(
          145deg,
          rgba(18, 29, 45, .98),
          rgba(13, 22, 34, .98)
        );

      border: 1px solid var(--border);

      border-radius: 21px;

      padding: 24px;

      box-shadow: var(--shadow);
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 13px;

      margin: 0 0 20px;

      font-size: 25px;
      font-weight: 850;
      letter-spacing: -.3px;
    }

    .panel-title-icon {
      width: 31px;
      height: 31px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;
      line-height: 1;
    }

    .panel-title-icon.orange {
      color: var(--orange);
    }

    .panel-title-icon.blue {
      color: var(--blue);
    }

    /* =========================================================
       QUICK ACTIONS
       ========================================================= */

    .quick-actions-panel {
      margin-bottom: 22px;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .action-button {
      min-height: 62px;

      border-radius: 13px;

      padding: 14px 20px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      font-size: 19px;
      font-weight: 850;
      letter-spacing: .2px;
    }

    .action-primary {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          #0c80ff,
          #0870ec
        );

      border: 1px solid #258fff;

      box-shadow:
        0 7px 18px rgba(0, 113, 255, .20);
    }

    .action-secondary {
      color: var(--text);

      background: transparent;

      border: 1px solid #0781ff;
    }

    .action-icon {
      font-size: 23px;
      line-height: 1;
    }

    /* =========================================================
       TWO COLUMN CONTENT
       ========================================================= */

    .content-grid {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 22px;

      align-items: stretch;
    }

    /* =========================================================
       STUDENT LOOKUP
       ========================================================= */

    .student-panel {
      min-height: 540px;
    }

    .lookup-label {
      display: block;

      margin-bottom: 9px;

      font-size: 17px;
      font-weight: 750;
    }

    .lookup-row {
      display: flex;
      gap: 12px;

      margin-bottom: 10px;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
    }

    .student-input {
      width: 100%;
      height: 62px;

      padding:
        0
        18px;

      border-radius: 13px;

      border: 1px solid var(--border-light);

      background: #17243a;

      color: var(--text);

      font-size: 19px;
      font-weight: 600;

      outline: none;
    }

    .student-input::placeholder {
      color: #8391a5;
    }

    .student-input:focus {
      border-color: #268fff;

      box-shadow:
        0 0 0 3px rgba(38, 143, 255, .12);
    }

    .scan-button {
      width: 64px;
      height: 62px;

      flex-shrink: 0;

      border-radius: 12px;

      border: 0;

      background:
        linear-gradient(
          135deg,
          #087fff,
          #096de8
        );

      color: white;

      font-size: 27px;
    }

    .help-text {
      margin: 0 0 17px;

      color: var(--muted);

      font-size: 16px;
      line-height: 1.45;
    }

    .lookup-button {
      width: 100%;
      min-height: 56px;

      border-radius: 12px;

      border: 0;

      background:
        linear-gradient(
          135deg,
          #087fff,
          #0871ed
        );

      color: #fff;

      font-size: 18px;
      font-weight: 850;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* =========================================================
       MESSAGE
       ========================================================= */

    .message {
      display: none;

      margin-top: 14px;
      padding: 13px 15px;

      border-radius: 11px;

      background: #202c3d;
      border: 1px solid #30425c;

      color: var(--muted);

      font-size: 15px;
      font-weight: 700;
    }

    .message.error {
      display: block;

      background: #3a171b;
      border-color: #733139;

      color: #ff9fa8;
    }

    .message.success {
      display: block;

      background: #0d3523;
      border-color: #1b7245;

      color: #66f59a;
    }

    /* =========================================================
       STUDENT CARD
       ========================================================= */

    .student-card {
      display: none;

      margin-top: 22px;

      padding: 22px;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          #132137,
          #0e1928
        );

      border: 1px solid #304967;
    }

    .student-card.visible {
      display: block;
    }

    .student-header {
      display: flex;
      align-items: center;

      gap: 16px;

      margin-bottom: 20px;
    }

    .avatar {
      width: 66px;
      height: 66px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #087fff,
          #0867e4
        );

      color: white;

      font-size: 28px;
      font-weight: 800;
    }

    .student-heading {
      min-width: 0;
      flex: 1;
    }

    .student-name {
      font-size: 25px;
      font-weight: 850;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .student-id {
      margin-top: 4px;

      color: var(--muted);

      font-size: 17px;
      font-weight: 650;
    }

    .grade-badge {
      flex-shrink: 0;

      padding: 8px 14px;

      border-radius: 12px;

      background: #25354d;
      border: 1px solid #354967;

      color: #e8edf5;

      font-size: 16px;
      font-weight: 750;
    }

    .student-status-row {
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 17px 0;

      border-top: 1px solid #2a3a51;
      border-bottom: 1px solid #2a3a51;
    }

    .current-status-label {
      color: var(--muted);

      font-size: 16px;
      font-weight: 650;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 8px 13px;

      border-radius: 20px;

      font-size: 14px;
      font-weight: 850;
    }

    .status-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;
    }

    .status-on {
      background: #073d20;
      border: 1px solid #1b8d4e;

      color: #5cff91;
    }

    .status-on .status-dot {
      background: #42f47d;

      box-shadow:
        0 0 7px rgba(66, 244, 125, .65);
    }

    .status-off {
      background: #252e3c;
      border: 1px solid #46546a;

      color: #bac4d1;
    }

    .status-off .status-dot {
      background: #98a4b4;
    }

    .change-status-button {
      width: 100%;
      min-height: 54px;

      margin-top: 18px;

      border-radius: 12px;

      border: 1px solid #40536d;

      background:
        linear-gradient(
          180deg,
          #34435a,
          #2c394d
        );

      color: white;

      font-size: 18px;
      font-weight: 800;
    }

    /* =========================================================
       ROSTER
       ========================================================= */

    .roster-panel {
      min-height: 540px;
    }

    .roster-search-wrapper {
      position: relative;

      margin-bottom: 18px;
    }

    .roster-search {
      width: 100%;
      height: 52px;

      padding: 0 16px 0 48px;

      border-radius: 12px;

      border: 1px solid var(--border-light);

      background: #17243a;

      color: var(--text);

      font-size: 16px;

      outline: none;
    }

    .roster-search:focus {
      border-color: #1684ff;
    }

    .roster-search-icon {
      position: absolute;

      left: 17px;
      top: 50%;

      transform: translateY(-50%);

      color: #8a99ad;

      font-size: 22px;

      pointer-events: none;
    }

    .roster-list {
      max-height: 395px;

      overflow-y: auto;

      padding-right: 3px;
    }

    .roster-item {
      display: flex;
      align-items: center;

      gap: 13px;

      min-height: 78px;

      padding: 12px 14px;

      margin-bottom: 10px;

      border-radius: 15px;

      background:
        linear-gradient(
          145deg,
          #17253a,
          #142135
        );

      border: 1px solid #2b3d57;

      transition:
        border-color .15s ease,
        transform .15s ease;
    }

    .roster-item:hover {
      border-color: #3b587a;
    }

    .roster-avatar {
      width: 48px;
      height: 48px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #087fff,
          #0869e7
        );

      color: white;

      font-size: 19px;
      font-weight: 800;
    }

    .roster-info {
      min-width: 0;
      flex: 1;
    }

    .roster-name {
      font-size: 18px;
      font-weight: 800;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .roster-id {
      margin-top: 4px;

      color: var(--muted);

      font-size: 14px;
    }

    .roster-grade {
      align-self: flex-start;

      padding: 5px 8px;

      border-radius: 8px;

      background: #25354c;
      color: #c9d3e0;

      font-size: 12px;
      font-weight: 800;
    }

    .roster-status {
      flex-shrink: 0;

      display: inline-flex;
      align-items: center;
      gap: 6px;

      padding: 6px 9px;

      border-radius: 13px;

      font-size: 12px;
      font-weight: 850;
    }

    .roster-status.on {
      background: #073a20;
      border: 1px solid #167b43;
      color: #58f28b;
    }

    .roster-status.off {
      background: #242d3a;
      border: 1px solid #465366;
      color: #aeb8c5;
    }

    .roster-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .roster-status.on .roster-status-dot {
      background: #43f27d;
    }

    .roster-status.off .roster-status-dot {
      background: #8d99a9;
    }

    .empty {
      padding: 40px 10px;

      text-align: center;

      color: var(--muted);
      font-weight: 700;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 950px) {
      main {
        width: min(920px, calc(100% - 28px));
      }

      .content-grid {
        grid-template-columns: 1fr;
      }

      .student-panel,
      .roster-panel {
        min-height: auto;
      }

      .roster-list {
        max-height: none;
      }
    }

    @media (max-width: 650px) {
      header {
        height: 72px;

        padding-left: 15px;
        padding-right: 15px;
      }

      .brand-icon {
        width: 40px;
        height: 40px;

        font-size: 29px;
      }

      .brand-title {
        font-size: 24px;
      }

      .system-status {
        padding: 7px 10px;
        font-size: 11px;
      }

      main {
        width: calc(100% - 20px);
        margin-top: 12px;
      }

      .stats {
        gap: 8px;
      }

      .stat {
        min-height: 92px;

        padding: 13px 8px;

        flex-direction: column;
        justify-content: center;
      }

      .stat-icon {
        width: auto;
        height: 30px;

        margin: 0 0 6px;

        font-size: 25px;
      }

      .stat-number {
        font-size: 28px;
      }

      .stat-label {
        margin-top: 5px;
        font-size: 11px;
      }

      .panel {
        padding: 17px;
        border-radius: 17px;
      }

      .panel-title {
        font-size: 21px;
        margin-bottom: 16px;
      }

      .quick-actions {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .action-button {
        min-height: 57px;
        font-size: 17px;
      }

      .lookup-row {
        gap: 8px;
      }

      .scan-button {
        width: 56px;
      }

      .student-card {
        padding: 17px;
      }

      .student-header {
        gap: 12px;
      }

      .avatar {
        width: 55px;
        height: 55px;
        font-size: 22px;
      }

      .student-name {
        font-size: 21px;
      }

      .student-id {
        font-size: 14px;
      }

      .grade-badge {
        padding: 6px 9px;
        font-size: 13px;
      }

      .student-status-row {
        flex-wrap: wrap;
      }

      .roster-item {
        padding: 11px;
      }

      .roster-avatar {
        width: 43px;
        height: 43px;
        font-size: 16px;
      }

      .roster-name {
        font-size: 16px;
      }

      .roster-status {
        font-size: 10px;
        padding: 5px 7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <div class="brand-icon" aria-hidden="true">🎓</div>

    <h1 class="brand-title">
      CAMPUS FLOW
    </h1>
  </div>

  <div class="system-status">
    <span class="system-dot"></span>
    SYSTEM ONLINE
  </div>
</header>


<main>

  <!-- =======================================================
       DASHBOARD
       ======================================================= -->

  <section class="stats">

    <div class="stat">
      <div class="stat-icon purple" aria-hidden="true">
        👥
      </div>

      <div class="stat-content">
        <div
          class="stat-number"
          id="studentCount"
        >
          0
        </div>

        <div class="stat-label">
          STUDENTS
        </div>
      </div>
    </div>


    <div class="stat">
      <div class="stat-icon green" aria-hidden="true">
        ✓
      </div>

      <div class="stat-content">
        <div
          class="stat-number"
          id="onCampusCount"
        >
          0
        </div>

        <div class="stat-label">
          ON CAMPUS
        </div>
      </div>
    </div>


    <div class="stat">
      <div class="stat-icon orange" aria-hidden="true">
        ⇄
      </div>

      <div class="stat-content">
        <div
          class="stat-number"
          id="movementCount"
        >
          0
        </div>

        <div class="stat-label">
          MOVEMENT
        </div>
      </div>
    </div>

  </section>


  <!-- =======================================================
       QUICK ACTIONS
       ======================================================= -->

  <section class="panel quick-actions-panel">

    <h2 class="panel-title">
      <span
        class="panel-title-icon orange"
        aria-hidden="true"
      >
        ⚡
      </span>

      Quick Actions
    </h2>

    <div class="quick-actions">

      <button
        class="action-button action-primary"
        id="scanButton"
        type="button"
      >
        <span
          class="action-icon"
          aria-hidden="true"
        >
          ▣
        </span>

        SCAN ID CARD
      </button>


      <button
        class="action-button action-secondary"
        id="rosterButton"
        type="button"
      >
        <span
          class="action-icon"
          aria-hidden="true"
        >
          👥
        </span>

        STUDENT ROSTER
      </button>

    </div>

  </section>


  <!-- =======================================================
       MAIN CONTENT
       ======================================================= -->

  <section class="content-grid">

    <!-- =====================================================
         STUDENT LOOKUP
         ===================================================== -->

    <section
      class="panel student-panel"
      id="studentSection"
    >

      <h2 class="panel-title">

        <span
          class="panel-title-icon blue"
          aria-hidden="true"
        >
          ⌕
        </span>

        Student ID

      </h2>


      <label
        class="lookup-label"
        for="studentId"
      >
        Scan or Enter Student ID
      </label>


      <div class="lookup-row">

        <div class="input-wrapper">

          <input
            class="student-input"
            id="studentId"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Enter Student ID"
            aria-label="Student ID"
          >

        </div>


        <button
          class="scan-button"
          id="scanInputButton"
          type="button"
          aria-label="Scan student ID"
        >
          ▦
        </button>

      </div>


      <div class="help-text">
        Scan the student's ID card or enter their ID number manually.
      </div>


      <button
        class="lookup-button"
        id="lookupButton"
        type="button"
      >
        <span aria-hidden="true">⌕</span>
        LOOK UP STUDENT
      </button>


      <div
        class="message"
        id="message"
      ></div>


      <!-- STUDENT CARD -->

      <div
        class="student-card"
        id="studentCard"
      >

        <div class="student-header">

          <div
            class="avatar"
            id="avatar"
          >
            JD
          </div>


          <div class="student-heading">

            <div
              class="student-name"
              id="studentName"
            >
              John Doe
            </div>

            <div
              class="student-id"
              id="displayStudentId"
            >
              ID: 100001
            </div>

          </div>


          <div
            class="grade-badge"
            id="studentGradeBadge"
          >
            Grade 9
          </div>

        </div>


        <div class="student-status-row">

          <span class="current-status-label">
            Current Status
          </span>


          <span
            class="status-pill status-on"
            id="statusPill"
          >
            <span class="status-dot"></span>

            <span id="statusPillText">
              ON CAMPUS
            </span>
          </span>

        </div>


        <button
          class="change-status-button"
          id="changeStatusButton"
          type="button"
        >
          ⇄ &nbsp; CHANGE STATUS
        </button>

      </div>

    </section>


    <!-- =====================================================
         STUDENT ROSTER
         ===================================================== -->

    <section
      class="panel roster-panel"
      id="rosterSection"
    >

      <h2 class="panel-title">

        <span
          class="panel-title-icon blue"
          aria-hidden="true"
        >
          👥
        </span>

        Student Roster

      </h2>


      <div class="roster-search-wrapper">

        <span
          class="roster-search-icon"
          aria-hidden="true"
        >
          ⌕
        </span>

        <input
          class="roster-search"
          id="rosterSearch"
          type="search"
          autocomplete="off"
          placeholder="Search students..."
          aria-label="Search students"
        >

      </div>


      <div
        class="roster-list"
        id="rosterList"
      ></div>

    </section>

  </section>

</main>


<!-- =========================================================
     STUDENT DATA
     ========================================================= -->

<script src="./students.js"></script>


<script>
  /*
   * ==========================================================
   * CAMPUS FLOW
   * Interface / application layer
   * ==========================================================
   *
   * students.js remains the source of student records.
   *
   * This version also stores status and movement information
   * locally in the browser so refreshing the page does not
   * immediately erase the current session state.
   */


  const STORAGE_KEY = "campus-flow-state-v1";


  /*
   * ----------------------------------------------------------
   * GET STUDENTS
   * ----------------------------------------------------------
   *
   * IMPORTANT:
   *
   * The previous version checked window.students.
   *
   * students.js declares:
   *
   *     const students = [...]
   *
   * A top-level const from a classic script is not necessarily
   * exposed as window.students.
   *
   * We therefore check the lexical variable directly.
   */

  let appStudents = [];

  if (
    typeof students !== "undefined" &&
    Array.isArray(students)
  ) {
    appStudents = students;
  } else {
    appStudents = [
      {
        id: "100001",
        firstName: "John",
        lastName: "Doe",
        grade: "9",
        status: "ON CAMPUS"
      }
    ];
  }


  /*
   * Normalize records.
   */

  appStudents = appStudents.map(student => ({
    id: String(
      student.id ??
      student.studentId ??
      ""
    ),

    firstName: String(
      student.firstName ??
      student.first ??
      ""
    ),

    lastName: String(
      student.lastName ??
      student.last ??
      ""
    ),

    grade: String(
      student.grade ??
      ""
    ),

    status:
      String(student.status ?? "OFF CAMPUS")
        .toUpperCase()
  }));


  /*
   * ----------------------------------------------------------
   * LOCAL STATE
   * ----------------------------------------------------------
   */

  let movementTotal = 0;


  function loadSavedState() {

    try {

      const saved =
        localStorage.getItem(
          STORAGE_KEY
        );

      if (!saved) {
        return;
      }

      const state =
        JSON.parse(saved);


      if (
        Array.isArray(state.students)
      ) {

        state.students.forEach(savedStudent => {

          const student =
            appStudents.find(
              item =>
                item.id ===
                String(savedStudent.id)
            );

          if (student) {

            student.status =
              String(
                savedStudent.status ??
                student.status
              ).toUpperCase();

          }

        });

      }


      if (
        Number.isFinite(
          Number(state.movementTotal)
        )
      ) {

        movementTotal =
          Number(
            state.movementTotal
          );

      }

    } catch (error) {

      console.warn(
        "Campus Flow state could not be restored.",
        error
      );

    }

  }


  function saveState() {

    try {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          students: appStudents.map(student => ({
            id: student.id,
            status: student.status
          })),

          movementTotal
        })
      );

    } catch (error) {

      console.warn(
        "Campus Flow state could not be saved.",
        error
      );

    }

  }


  /*
   * Restore saved state before rendering.
   */

  loadSavedState();


  /*
   * ----------------------------------------------------------
   * DOM REFERENCES
   * ----------------------------------------------------------
   */

  const studentCountEl =
    document.getElementById(
      "studentCount"
    );

  const onCampusCountEl =
    document.getElementById(
      "onCampusCount"
    );

  const movementCountEl =
    document.getElementById(
      "movementCount"
    );

  const studentIdInput =
    document.getElementById(
      "studentId"
    );

  const lookupButton =
    document.getElementById(
      "lookupButton"
    );

  const scanButton =
    document.getElementById(
      "scanButton"
    );

  const scanInputButton =
    document.getElementById(
      "scanInputButton"
    );

  const rosterButton =
    document.getElementById(
      "rosterButton"
    );

  const changeStatusButton =
    document.getElementById(
      "changeStatusButton"
    );

  const studentCard =
    document.getElementById(
      "studentCard"
    );

  const studentNameEl =
    document.getElementById(
      "studentName"
    );

  const displayStudentIdEl =
    document.getElementById(
      "displayStudentId"
    );

  const studentGradeBadge =
    document.getElementById(
      "studentGradeBadge"
    );

  const avatarEl =
    document.getElementById(
      "avatar"
    );

  const statusPill =
    document.getElementById(
      "statusPill"
    );

  const statusPillText =
    document.getElementById(
      "statusPillText"
    );

  const messageEl =
    document.getElementById(
      "message"
    );

  const rosterList =
    document.getElementById(
      "rosterList"
    );

  const rosterSearch =
    document.getElementById(
      "rosterSearch"
    );


  /*
   * ----------------------------------------------------------
   * HELPERS
   * ----------------------------------------------------------
   */

  function fullName(student) {

    return (
      `${student.firstName} ${student.lastName}`
        .trim()
    );

  }


  function initials(student) {

    const first =
      student.firstName
        ?.trim()
        ?.charAt(0)
        ?.toUpperCase() || "";

    const last =
      student.lastName
        ?.trim()
        ?.charAt(0)
        ?.toUpperCase() || "";

    return (
      `${first}${last}` ||
      "ST"
    );

  }


  function getOnCampusCount() {

    return appStudents.filter(
      student =>
        student.status ===
        "ON CAMPUS"
    ).length;

  }


  function showMessage(
    text,
    type = ""
  ) {

    messageEl.textContent = text;

    messageEl.className =
      "message";

    if (type) {
      messageEl.classList.add(
        type
      );
    }

  }


  function clearMessage() {

    messageEl.textContent = "";

    messageEl.className =
      "message";

  }


  /*
   * ----------------------------------------------------------
   * DASHBOARD
   * ----------------------------------------------------------
   */

  function updateDashboard() {

    studentCountEl.textContent =
      appStudents.length;

    onCampusCountEl.textContent =
      getOnCampusCount();

    movementCountEl.textContent =
      movementTotal;

  }


  /*
   * ----------------------------------------------------------
   * STUDENT CARD
   * ----------------------------------------------------------
   */

  let selectedStudent = null;


  function displayStudent(student) {

    if (!student) {
      return;
    }

    selectedStudent =
      student;

    const name =
      fullName(student);


    studentNameEl.textContent =
      name || "Student";


    displayStudentIdEl.textContent =
      `ID: ${student.id}`;


    studentGradeBadge.textContent =
      `Grade ${student.grade || "—"}`;


    avatarEl.textContent =
      initials(student);


    updateStudentStatusDisplay();


    studentCard.classList.add(
      "visible"
    );


    clearMessage();

  }


  function updateStudentStatusDisplay() {

    if (!selectedStudent) {
      return;
    }

    const isOnCampus =
      selectedStudent.status ===
      "ON CAMPUS";


    statusPill.className =
      `status-pill ${
        isOnCampus
          ? "status-on"
          : "status-off"
      }`;


    statusPillText.textContent =
      selectedStudent.status;


    updateDashboard();

  }


  /*
   * ----------------------------------------------------------
   * LOOKUP
   * ----------------------------------------------------------
   */

  function lookupStudent() {

    const id =
      studentIdInput.value
        .trim();


    if (!id) {

      showMessage(
        "Enter or scan a student ID.",
        "error"
      );

      studentCard.classList.remove(
        "visible"
      );

      return;

    }


    const student =
      appStudents.find(
        item =>
          item.id === id
      );


    if (!student) {

      showMessage(
        `No student was found with ID ${id}.`,
        "error"
      );

      studentCard.classList.remove(
        "visible"
      );

      selectedStudent = null;

      return;

    }


    displayStudent(student);

  }


  /*
   * ----------------------------------------------------------
   * CHANGE STATUS
   * ----------------------------------------------------------
   */

  function changeStatus() {

    if (!selectedStudent) {

      showMessage(
        "Look up a student first.",
        "error"
      );

      return;

    }


    if (
      selectedStudent.status ===
      "ON CAMPUS"
    ) {

      selectedStudent.status =
        "OFF CAMPUS";

    } else {

      selectedStudent.status =
        "ON CAMPUS";

    }


    movementTotal++;


    saveState();


    updateStudentStatusDisplay();


    renderRoster(
      rosterSearch.value
    );


    showMessage(
      `${fullName(selectedStudent)} is now ${selectedStudent.status}.`,
      "success"
    );

  }


  /*
   * ----------------------------------------------------------
   * ROSTER
   * ----------------------------------------------------------
   */

  function renderRoster(
    searchTerm = ""
  ) {

    const term =
      String(searchTerm)
        .trim()
        .toLowerCase();


    const filtered =
      appStudents.filter(
        student => {

          if (!term) {
            return true;
          }

          const searchable =
            [
              fullName(student),
              student.id,
              student.grade,
              student.status
            ]
              .join(" ")
              .toLowerCase();

          return searchable.includes(
            term
          );

        }
      );


    rosterList.innerHTML = "";


    if (!filtered.length) {

      const empty =
        document.createElement(
          "div"
        );

      empty.className =
        "empty";

      empty.textContent =
        "No students found.";

      rosterList.appendChild(
        empty
      );

      return;

    }


    filtered.forEach(
      student => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "roster-item";


        const avatar =
          document.createElement(
            "div"
          );

        avatar.className =
          "roster-avatar";

        avatar.textContent =
          initials(student);


        const info =
          document.createElement(
            "div"
          );

        info.className =
          "roster-info";


        const name =
          document.createElement(
            "div"
          );

        name.className =
          "roster-name";

        name.textContent =
          fullName(student) ||
          "Student";


        const id =
          document.createElement(
            "div"
          );

        id.className =
          "roster-id";

        id.textContent =
          `ID: ${student.id}`;


        info.appendChild(name);
        info.appendChild(id);


        const grade =
          document.createElement(
            "div"
          );

        grade.className =
          "roster-grade";

        grade.textContent =
          `Grade ${student.grade || "—"}`;


        const status =
          document.createElement(
            "div"
          );

        const isOnCampus =
          student.status ===
          "ON CAMPUS";


        status.className =
          `roster-status ${
            isOnCampus
              ? "on"
              : "off"
          }`;


        const statusDot =
          document.createElement(
            "span"
          );

        statusDot.className =
          "roster-status-dot";


        const statusText =
          document.createElement(
            "span"
          );

        statusText.textContent =
          isOnCampus
            ? "ON CAMPUS"
            : "OFF CAMPUS";


        status.appendChild(
          statusDot
        );

        status.appendChild(
          statusText
        );


        item.appendChild(
          avatar
        );

        item.appendChild(
          info
        );

        item.appendChild(
          grade
        );

        item.appendChild(
          status
        );


        /*
         * Clicking a roster entry selects
         * that student.
         */

        item.addEventListener(
          "click",
          () => {

            studentIdInput.value =
              student.id;

            displayStudent(
              student
            );


            document
              .getElementById(
                "studentSection"
              )
              .scrollIntoView({
                behavior: "smooth",
                block: "start"
              });

          }
        );


        rosterList.appendChild(
          item
        );

      }
    );

  }


  /*
   * ----------------------------------------------------------
   * QUICK ACTIONS
   * ----------------------------------------------------------
   */

  function focusScanner() {

    studentIdInput.focus();

    studentIdInput.select();

  }


  scanButton.addEventListener(
    "click",
    focusScanner
  );


  scanInputButton.addEventListener(
    "click",
    focusScanner
  );


  rosterButton.addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "rosterSection"
        )
        .scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      setTimeout(
        () => {
          rosterSearch.focus();
        },
        350
      );

    }
  );


  /*
   * ----------------------------------------------------------
   * EVENTS
   * ----------------------------------------------------------
   */

  lookupButton.addEventListener(
    "click",
    lookupStudent
  );


  changeStatusButton.addEventListener(
    "click",
    changeStatus
  );


  rosterSearch.addEventListener(
    "input",
    event => {

      renderRoster(
        event.target.value
      );

    }
  );


  /*
   * Enter key performs lookup.
   */

  studentIdInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        lookupStudent();

      }

    }
  );


  /*
   * ----------------------------------------------------------
   * INITIAL RENDER
   * ----------------------------------------------------------
   */

  updateDashboard();

  renderRoster();


  /*
   * Show the first student on initial load.
   *
   * This gives the dashboard the same useful
   * presentation as the design rendering.
   */

  if (appStudents.length === 1) {

    displayStudent(
      appStudents[0]
    );

  }


  /*
   * ----------------------------------------------------------
   * SERVICE WORKER
   * ----------------------------------------------------------
   */

  if (
    "serviceWorker" in navigator
  ) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register(
            "./service-worker.js"
          )
          .catch(
            error => {

              console.warn(
                "Campus Flow service worker registration failed:",
                error
              );

            }
          );

      }
    );

  }

</script>

</body>
</html>
