<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default"
>

<meta name="theme-color" content="#090d12">

<title>Campus Flow</title>

<style>
:root {
  --bg: #090d12;
  --card: #171d24;
  --card2: #232a33;
  --border: #2d3743;
  --text: #f4f6f8;
  --muted: #a5aeb9;
  --green: #42dc8c;
  --green-dark: #0c3825;
  --white-button: #f4f5f6;
  --button-text: #151a20;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

body {
  padding-bottom: 40px;
}

.header {
  background: #000;
  padding:
    calc(18px + env(safe-area-inset-top))
    20px
    20px;
  text-align: center;
  border-bottom: 1px solid #151a20;
}

.header h1 {
  margin: 0;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.app {
  width: min(920px, calc(100% - 32px));
  margin: 18px auto 0;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px 10px 16px;
  text-align: center;
}

.stat-number {
  font-size: 36px;
  line-height: 1;
  font-weight: 800;
  margin-bottom: 8px;
}

.stat-label {
  color: var(--muted);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .5px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 24px;
  margin-bottom: 20px;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 20px;
  font-size: 25px;
  font-weight: 800;
}

.section-title::before {
  content: "";
  width: 5px;
  height: 28px;
  background: var(--text);
  border-radius: 4px;
  flex: 0 0 auto;
}

.quick-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

button {
  appearance: none;
  border: 0;
  border-radius: 13px;
  min-height: 62px;
  padding: 14px 18px;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: .2px;
  cursor: pointer;
  transition:
    transform .12s ease,
    opacity .12s ease;
}

button:active {
  transform: scale(.98);
}

.primary {
  background: var(--white-button);
  color: var(--button-text);
}

.secondary {
  background: var(--card2);
  color: var(--text);
}

label {
  display: block;
  font-size: 18px;
  font-weight: 750;
  margin-bottom: 8px;
}

.help {
  color: var(--muted);
  font-size: 16px;
  line-height: 1.4;
  margin: 9px 0 20px;
}

.input-wrap {
  position: relative;
}

input {
  width: 100%;
  height: 66px;
  border-radius: 14px;
  border: 2px solid #45505e;
  background: #0e1319;
  color: var(--text);
  padding: 0 54px 0 18px;
  font-size: 22px;
  outline: none;
}

input:focus {
  border-color: #697787;
}

.scan-icon {
  position: absolute;
  right: 17px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  border: 2px solid var(--text);
  pointer-events: none;
}

.scan-icon::before,
.scan-icon::after {
  content: "";
  position: absolute;
  background: var(--text);
}

.scan-icon::before {
  width: 10px;
  height: 2px;
  left: 3px;
  top: 7px;
}

.scan-icon::after {
  width: 2px;
  height: 10px;
  left: 7px;
  top: 3px;
}

.lookup {
  width: 100%;
  margin-top: 0;
}

.student-result {
  margin-top: 20px;
  background: #0d2c1f;
  border: 1px solid #1d7249;
  border-radius: 18px;
  padding: 22px;
}

.student-heading {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
}

.avatar {
  width: 62px;
  height: 62px;
  flex: 0 0 62px;
  border-radius: 50%;
  background: #f4f5f6;
  color: #1a2027;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  font-weight: 850;
}

.student-name {
  font-size: 25px;
  font-weight: 800;
}

.student-id {
  color: var(--muted);
  font-size: 17px;
  margin-top: 3px;
  font-weight: 600;
}

.details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 18px;
}

.detail {
  border: 1px solid #216d49;
  border-radius: 13px;
  padding: 14px;
}

.detail-label {
  color: var(--muted);
  font-size: 14px;
  font-weight: 800;
  letter-spacing: .7px;
  margin-bottom: 5px;
}

.detail-value {
  font-size: 20px;
  font-weight: 800;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--green);
  color: #fff;
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 20px;
}

.status-dot {
  width: 10px;
  height: 10px;
  background: #fff;
  border-radius: 50%;
}

.student-result.off-campus {
  background: #241518;
  border-color: #71343b;
}

.student-result.off-campus .detail {
  border-color: #71343b;
}

.student-result.off-campus .status-pill {
  background: #d94c59;
}

.roster-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--card2);
  border: 1px solid #2b3541;
  border-radius: 13px;
  padding: 17px;
}

.roster-name {
  font-size: 19px;
  font-weight: 800;
}

.roster-meta {
  color: var(--muted);
  font-size: 16px;
  margin-top: 3px;
}

.roster-status {
  background: var(--green-dark);
  color: var(--green);
  border-radius: 999px;
  padding: 9px 14px;
  font-size: 14px;
  font-weight: 800;
  white-space: nowrap;
}

.roster-status.off {
  background: #3a171b;
  color: #ff7883;
}

.hidden {
  display: none !important;
}

@media (max-width: 650px) {
  .app {
    width: min(100% - 20px, 920px);
    margin-top: 12px;
  }

  .stats {
    gap: 8px;
  }

  .stat-card {
    border-radius: 15px;
    padding: 15px 6px;
  }

  .stat-number {
    font-size: 31px;
  }

  .stat-label {
    font-size: 13px;
  }

  .card {
    padding: 18px;
    border-radius: 16px;
  }

  .quick-actions,
  .details {
    grid-template-columns: 1fr;
  }

  button {
    min-height: 60px;
  }

  .section-title {
    font-size: 23px;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>Campus Flow</h1>
</header>

<main class="app">

  <!-- DASHBOARD -->
  <section class="stats">

    <div class="stat-card">
      <div class="stat-number" id="studentCount">0</div>
      <div class="stat-label">STUDENTS</div>
    </div>

    <div class="stat-card">
      <div class="stat-number" id="onCampusCount">0</div>
      <div class="stat-label">ON CAMPUS</div>
    </div>

    <div class="stat-card">
      <div class="stat-number" id="movementCount">0</div>
      <div class="stat-label">MOVEMENT</div>
    </div>

  </section>

  <!-- QUICK ACTIONS -->
  <section class="card">

    <h2 class="section-title">Quick Actions</h2>

    <div class="quick-actions">

      <button
        class="primary"
        type="button"
        onclick="focusStudentId()"
      >
        SCAN ID CARD
      </button>

      <button
        class="secondary"
        type="button"
        onclick="focusRoster()"
      >
        STUDENT ROSTER
      </button>

    </div>

  </section>

  <!-- STUDENT ID -->
  <section class="card">

    <h2 class="section-title">Student ID</h2>

    <label for="studentId">
      Scan or Enter Student ID
    </label>

    <div class="input-wrap">

      <input
        id="studentId"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Enter student ID"
        value="100001"
      >

      <span class="scan-icon"></span>

    </div>

    <div class="help">
      Scan the student's ID card or enter the ID manually.
    </div>

    <button
      id="lookupStudent"
      class="primary lookup"
      type="button"
    >
      LOOK UP STUDENT
    </button>

    <!-- STUDENT RESULT -->
    <div
      id="studentResult"
      class="student-result"
    >

      <div class="student-heading">

        <div
          id="studentAvatar"
          class="avatar"
        >
          JD
        </div>

        <div>
          <div
            id="studentName"
            class="student-name"
          >
            John Doe
          </div>

          <div
            id="studentIdDisplay"
            class="student-id"
          >
            ID: 100001
          </div>
        </div>

      </div>

      <div class="details">

        <div class="detail">

          <div class="detail-label">
            GRADE
          </div>

          <div
            id="studentGrade"
            class="detail-value"
          >
            9
          </div>

        </div>

        <div class="detail">

          <div class="detail-label">
            STATUS
          </div>

          <div
            id="studentStatus"
            class="detail-value"
          >
            ON CAMPUS
          </div>

        </div>

      </div>

      <div
        id="statusPill"
        class="status-pill"
      >
        <span class="status-dot"></span>
        <span id="statusPillText">
          ON CAMPUS
        </span>
      </div>

      <button
        id="changeStatus"
        class="primary lookup"
        type="button"
      >
        CHANGE STATUS
      </button>

    </div>

  </section>

  <!-- STUDENT ROSTER -->
  <section
    id="rosterSection"
    class="card"
  >

    <h2 class="section-title">
      Student Roster
    </h2>

    <div id="roster"></div>

  </section>

</main>

<!-- STUDENT DATA -->
<script src="./students.js"></script>

<!-- CAMPUS FLOW APP -->
<script>

let currentStudentId = null;

function $(id) {
  return document.getElementById(id);
}

function initials(student) {
  const first =
    student.firstName
      ? student.firstName.charAt(0)
      : "";

  const last =
    student.lastName
      ? student.lastName.charAt(0)
      : "";

  return (first + last).toUpperCase();
}

function updateDashboard() {

  $("studentCount").textContent =
    getStudentCount();

  $("onCampusCount").textContent =
    getOnCampusCount();

  $("movementCount").textContent =
    getMovementCount();
}

function updateStudentDisplay(student) {

  currentStudentId = student.id;

  $("studentAvatar").textContent =
    initials(student);

  $("studentName").textContent =
    `${student.firstName} ${student.lastName}`;

  $("studentIdDisplay").textContent =
    `ID: ${student.id}`;

  $("studentGrade").textContent =
    student.grade;

  $("studentStatus").textContent =
    student.status;

  $("statusPillText").textContent =
    student.status;

  const result = $("studentResult");

  if (student.status === "ON CAMPUS") {
    result.classList.remove("off-campus");
  } else {
    result.classList.add("off-campus");
  }

  renderRoster();
  updateDashboard();
}

function lookupStudent() {

  const id =
    $("studentId").value.trim();

  const student =
    findStudent(id);

  if (!student) {

    alert("Student not found.");

    $("studentId").focus();

    return;
  }

  updateStudentDisplay(student);
}

function changeCurrentStudentStatus() {

  if (!currentStudentId) {

    const id =
      $("studentId").value.trim();

    const student =
      findStudent(id);

    if (!student) {
      alert("Look up a student first.");
      return;
    }

    currentStudentId = student.id;
  }

  const student =
    changeStudentStatus(currentStudentId);

  if (!student) {
    alert("Student not found.");
    return;
  }

  updateStudentDisplay(student);
}

function renderRoster() {

  const roster =
    $("roster");

  roster.innerHTML = "";

  students.forEach(student => {

    const item =
      document.createElement("div");

    item.className =
      "roster-item";

    const statusClass =
      student.status === "ON CAMPUS"
        ? ""
        : "off";

    item.innerHTML = `

      <div>

        <div class="roster-name">
          ${student.firstName} ${student.lastName}
        </div>

        <div class="roster-meta">
          ${student.id} · Grade ${student.grade}
        </div>

      </div>

      <div class="roster-status ${statusClass}">
        ${student.status}
      </div>

    `;

    item.addEventListener("click", () => {

      $("studentId").value =
        student.id;

      updateStudentDisplay(student);

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    });

    roster.appendChild(item);

  });

}

function focusStudentId() {

  $("studentId").focus();

  $("studentId").select();

}

function focusRoster() {

  $("rosterSection").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}

document.addEventListener(
  "DOMContentLoaded",
  () => {

    updateDashboard();

    renderRoster();

    const startingStudent =
      findStudent(
        $("studentId").value.trim()
      );

    if (startingStudent) {
      updateStudentDisplay(startingStudent);
    }

    $("lookupStudent")
      .addEventListener(
        "click",
        lookupStudent
      );

    $("changeStatus")
      .addEventListener(
        "click",
        changeCurrentStudentStatus
      );

    $("studentId")
      .addEventListener(
        "keydown",
        event => {

          if (event.key === "Enter") {
            lookupStudent();
          }

        }
      );

  }
);

</script>

</body>
</html>
