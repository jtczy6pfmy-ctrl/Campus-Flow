<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Campus Flow">

<meta name="theme-color" content="#111827">

<title>Campus Flow</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  color-scheme:light dark;

  --bg:#eef1f5;
  --card:#fff;
  --border:#dce2e8;
  --text:#17202a;
  --muted:#68727d;

  --input:#fff;
  --input-border:#c8ced6;

  --primary:#111827;
  --primary-text:#fff;

  --secondary:#e7ebef;
  --secondary-text:#17202a;

  --blue:#2563eb;
  --green:#16834b;
  --orange:#c56a00;
  --red:#b42318;
  --purple:#6d3fc0;

  --shadow:0 5px 20px rgba(15,23,42,.08);
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  -webkit-font-smoothing:antialiased;
}

header{
  background:linear-gradient(
    180deg,
    #18202c,
    #0b1017
  );

  color:#fff;

  padding:
    calc(17px + env(safe-area-inset-top))
    18px
    17px;

  text-align:center;

  font-size:24px;
  font-weight:850;

  position:sticky;
  top:0;
  z-index:50;

  box-shadow:
    0 2px 12px rgba(0,0,0,.18);
}

.app{
  width:min(1150px,100%);
  margin:auto;

  padding:
    15px
    12px
    calc(50px + env(safe-area-inset-bottom));
}


/* NAV */

.nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;

  margin-bottom:15px;
}

.nav button{
  margin:0;
  min-height:45px;
  font-size:13px;
}

.nav button.active{
  background:var(--blue);
  color:#fff;
}


/* DASHBOARD */

.dashboard-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
  margin-bottom:15px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px;
  box-shadow:var(--shadow);
}

.stat-label{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
}

.stat-value{
  margin-top:4px;
  font-size:24px;
  font-weight:900;
}


/* SECTIONS */

.page{
  display:none;
}

.page.active{
  display:block;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:var(--shadow);
}

.card h2{
  margin:0 0 16px;
  font-size:19px;
  font-weight:850;

  display:flex;
  align-items:center;
  gap:9px;
}

.card h2::before{
  content:"";

  width:4px;
  height:20px;

  border-radius:4px;

  background:var(--primary);
}


/* FORM */

label{
  display:block;
  margin:11px 0 6px;

  font-size:13px;
  font-weight:750;
}

input,
select,
textarea{
  width:100%;

  padding:12px 13px;

  border:1px solid var(--input-border);
  border-radius:10px;

  background:var(--input);
  color:var(--text);

  font-family:inherit;
  font-size:16px;

  outline:none;
}

textarea{
  min-height:95px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--blue);

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.12);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.form-grid.three{
  grid-template-columns:repeat(3,1fr);
}


/* BUTTONS */

button{
  width:100%;

  border:0;
  border-radius:10px;

  min-height:46px;

  padding:11px 14px;

  margin-top:9px;

  background:var(--primary);
  color:var(--primary-text);

  font-family:inherit;
  font-size:14px;
  font-weight:800;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(.985);
}

button.blue{
  background:var(--blue);
  color:#fff;
}

button.green{
  background:var(--green);
  color:#fff;
}

button.orange{
  background:var(--orange);
  color:#fff;
}

button.red{
  background:var(--red);
  color:#fff;
}

button.purple{
  background:var(--purple);
  color:#fff;
}

button.secondary{
  background:var(--secondary);
  color:var(--secondary-text);
}


/* TWO COLUMN */

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}


/* TABLE */

.table-wrap{
  overflow-x:auto;
  border:1px solid var(--border);
  border-radius:11px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th,
td{
  padding:11px;
  text-align:left;
  border-bottom:1px solid var(--border);
  font-size:13px;
}

th{
  background:var(--secondary);
  font-weight:850;
}

tr:last-child td{
  border-bottom:0;
}


/* STUDENT */

.student-name{
  font-size:24px;
  font-weight:900;
}

.student-meta{
  color:var(--muted);
  line-height:1.7;
  margin-top:5px;
}

.badge{
  display:inline-block;

  padding:5px 9px;

  margin:8px 4px 0 0;

  border-radius:999px;

  background:var(--secondary);

  font-size:11px;
  font-weight:800;
}


/* TIMELINE */

.timeline{
  position:relative;
  padding-left:22px;
}

.timeline::before{
  content:"";

  position:absolute;

  left:6px;
  top:5px;
  bottom:5px;

  width:2px;

  background:var(--border);
}

.event{
  position:relative;

  padding:11px 13px;

  margin-bottom:9px;

  border-radius:10px;

  background:
    color-mix(
      in srgb,
      var(--secondary) 65%,
      transparent
    );
}

.event::before{
  content:"";

  position:absolute;

  left:-20px;
  top:17px;

  width:10px;
  height:10px;

  border-radius:50%;

  background:var(--blue);

  border:2px solid var(--card);
}

.event-title{
  font-weight:850;
}

.event-detail{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.event-time{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}


/* SEARCH RESULTS */

.results{
  display:grid;
  gap:8px;
  margin-top:12px;
}

.result{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  padding:12px;

  border:1px solid var(--border);
  border-radius:11px;
}

.result-name{
  font-weight:850;
}

.result-info{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.result button{
  width:auto;
  min-width:78px;
  margin:0;
}


/* EMPTY */

.empty{
  color:var(--muted);
  text-align:center;
  padding:20px 10px;
  font-size:14px;
}


/* HIDDEN */

.hidden{
  display:none !important;
}


/* MOBILE */

@media(max-width:850px){

  .dashboard-grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:650px){

  .nav{
    grid-template-columns:repeat(2,1fr);
  }

  .two,
  .form-grid,
  .form-grid.three{
    grid-template-columns:1fr;
  }

}

@media(max-width:500px){

  .dashboard-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .app{
    padding:10px 9px 40px;
  }

  .card{
    padding:15px;
  }

  header{
    font-size:22px;
  }

}


/* DARK */

@media(prefers-color-scheme:dark){

  :root{

    --bg:#0b0f14;
    --card:#171d24;

    --border:#2c3540;

    --text:#f4f6f8;
    --muted:#a7b0ba;

    --input:#0f141a;
    --input-border:#3b4550;

    --primary:#f4f6f8;
    --primary-text:#11161c;

    --secondary:#29323c;
    --secondary-text:#f4f6f8;

  }

  header{
    background:#000;
  }

}

</style>
</head>


<body>


<header>
  Campus Flow
</header>


<main class="app">


<!-- NAVIGATION -->

<nav class="nav">

  <button
    class="active"
    data-page="dashboard"
  >
    DASHBOARD
  </button>

  <button
    data-page="students"

  </button>

  <button

  >

  </button>

  <button
    data-page="movement"
  >
    MOVEMENT
  </button>

</nav>



<!-- =========================
     DASHBOARD
========================= -->

<section
  id="dashboard"
  class="page active"
>

<div class="dashboard-grid">

  <div class="stat">
    <div class="stat-label">
      Students
    </div>
    <div
      class="stat-value"
      id="statStudents"
    >0</div>
  </div>

  <div class="stat">
    <div class="stat-label">

    </div>
    <div

    >0</div>
  </div>

  <div class="stat">
    <div class="stat-label">
      Absent
    </div>
    <div
      class="stat-value"
      id="statAbsent"
    >0</div>
  </div>

  <div class="stat">
    <div class="stat-label">
      Tardy
    </div>
    <div
      class="stat-value"
      id="statTardy"
    >0</div>
  </div>

  <div class="stat">
    <div class="stat-label">
      Out
    </div>
    <div
      class="stat-value"
      id="statOut"
    >0</div>

  <div class="stat">
    <div class="stat-label">
      Discipline
    </div>
    <div

</div>



<div class="two">


<!-- QUICK LOOKUP -->

<section class="card">

  <h2>
    Student Lookup

  <label for="globalSearch">
    Student ID / Name / Grade / Room

  <input
    id="globalSearch"

  >

    id="searchResults"

  ></div>

</section>



<!-- RECENT ACTIVITY -->

<section class="card">

  <h2>
    Recent Activity
  </h2>

  <div
    id="recentActivity"
    class="timeline"
  ></div>

</section>

</div>


</section>



<!-- =========================
     STUDENTS
========================= -->

<section
  id="students"
  class="page"
>

<section class="card">

  <h2>
    Student Management
  </h2>


  <div class="form-grid">

    <div>

      <label>
        Search Students
      </label>

      <input
        id="studentSearch"
        placeholder="Name, ID, grade or room"
      >

    </div>


    <div>

      <label>
        Action
      </label>

      <button
        id="newStudentButton"

      >
        ADD STUDENT
      </button>

    </div>

  </div>


  <div
    id="studentTable"

</section>


<section

>

  <h2>

  <div class="form-grid three">

    <div>

      <label>

    </div>


    <div>

<!-- =========================

========================= -->

<section

>

    id="attendanceTable"

</section>

</section>



<!-- =========================
     MOVEMENT
========================= -->

<section
  id="movement"

>

<section class="card">

<!-- =========================

<script>

"use strict";


/*
==================================================
 CAMPUS FLOW
 BUILD 4
==================================================

 Local data architecture.

 Future adapter:

 Browser Storage
       ↓
 Data Layer
       ↓
 SQL Server / API

==================================================
*/


/* ================================================
   DEFAULT DATA
================================================ */

const defaultStudents = [

  {
    id:"100001",
    name:"Alex Johnson",
    grade:"8",
    room:"204",
    active:true
  },

  {
    id:"100002",
    name:"Jordan Smith",
    grade:"10",
    room:"112",
    active:true
  },

  {
    id:"100003",
    name:"Taylor Brown",
    grade:"6",
    room:"301",
    active:true
  },

  {
    id:"100004",
    name:"Morgan Davis",
    grade:"9",
    room:"118",
    active:true
  },

  {
    id:"100005",
    name:"Casey Wilson",
    grade:"7",
    room:"207",
    active:true
  }

];


let students =
  load(
    "campusFlowStudents",
    defaultStudents
  );


let records =
  load(
    "campusFlowRecords",
    []
  );


let audit =
  load(
    "campusFlowAudit",
    []
  );


let selectedStudent = null;



/* ================================================
   STORAGE
================================================ */

function load(
  key,
  fallback
){

  try{

    const data =
      localStorage.getItem(
        key
      );

    return data
      ?
      JSON.parse(data)
      :
      fallback;

  }catch{

    return fallback;

  }

}



function save(){

  localStorage.setItem(
    "campusFlowStudents",
    JSON.stringify(
      students
    )
  );


  localStorage.setItem(
    "campusFlowRecords",
    JSON.stringify(
      records
    )
  );


  localStorage.setItem(
    "campusFlowAudit",
    JSON.stringify(
      audit
    )
  );

}



/* ================================================
   UTILITIES
================================================ */

function escapeHtml(
  value
){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



function today(){

  return new Date()
    .toDateString();

}



function isToday(
  timestamp
){

  return new Date(
    timestamp
  ).toDateString()
    ===
    today();

}



function time(
  timestamp
){

  return new Date(
    timestamp
  ).toLocaleTimeString(
    [],
    {
      hour:"numeric",
      minute:"2-digit"
    }
  );

}



/* ================================================
   AUDIT
================================================ */

function auditLog(
  action,
  student,
  detail=""
){

  audit.unshift({

    id:Date.now(),

    action,

    studentId:
      student
      ?
      student.id
      :
      "",

    studentName:
      student
      ?
      student.name
      :
      "",

    detail,

    timestamp:
      new Date()
        .toISOString()

  });

}



/* ================================================
   RECORD
================================================ */

function addRecord(
  student,
  category,
  action,
  detail=""
){

  if(!student){

    return;

  }


  const record = {

    id:
      Date.now(),

    studentId:
      student.id,

    studentName:
      student.name,

    category,

    action,

    detail,

    timestamp:
      new Date()
        .toISOString()

  };


  records.unshift(
    record
  );


  auditLog(
    action,
    student,
    detail
  );


  save();


  refreshAll();

}



/* ================================================
   NAVIGATION
================================================ */

document
  .querySelectorAll(
    "[data-page]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          showPage(
            button.dataset.page
          );

        }
      );

    }
  );



function showPage(
  page
){

  document
    .querySelectorAll(
      ".page"
    )
    .forEach(
      section =>
        section.classList.remove(
          "active"
        )
    );


  const target =
    document.getElementById(
      page
    );


  if(target){

    target.classList.add(
      "active"
    );

  }


  document
    .querySelectorAll(
      "[data-page]"
    )
    .forEach(
      button =>
        button.classList.toggle(
          "active",
          button.dataset.page
            ===
            page
        )
    );


  refreshAll();

}



/* ================================================
   FIND STUDENTS
================================================ */

function findStudents(
  query
){

  query =
    query
      .trim()
      .toLowerCase();


  if(!query){

    return [];

  }


  return students.filter(
    student =>

      student.id
        .toLowerCase()
        .includes(query)

      ||

      student.name
        .toLowerCase()
        .includes(query)

      ||

      student.grade
        .toLowerCase()
        .includes(query)

      ||

      student.room
        .toLowerCase()
        .includes(query)

  );

}



/* ================================================
   RENDER RESULTS
================================================ */

function renderResults(
container,
results
){

  if(!results.length){

    container.innerHTML = `

      <div class="empty">
        No students found.
      </div>

    `;

    return;

  }


  container.innerHTML =
    results
      .map(
        student => `

          <div class="result">

            <div>

              <div class="result-name">

                ${escapeHtml(
                  student.name
                )}

              </div>

              <div class="result-info">

                ID:
                ${escapeHtml(
                  student.id
                )}

                · Grade
                ${escapeHtml(
                  student.grade
                )}

                · Room
                ${escapeHtml(
                  student.room
                )}

              </div>

            </div>


            <button
              class="blue"
              data-select="${escapeHtml(
                student.id
              )}"
            >
              SELECT
            </button>

          </div>

        `
      )
      .join("");


  container
    .querySelectorAll(
      "[data-select]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            selectStudent(
              button.dataset.select
            );

          }
        );

      }
    );

}



/* ================================================
   SELECT STUDENT
================================================ */

function selectStudent(
id
){

  selectedStudent =
    students.find(
      student =>
        student.id === id
    );


  if(!selectedStudent){

    return;

  }


  renderDetail();


  showPage(
    "studentDetail"
  );

}



/* ================================================
   STUDENT DETAIL
================================================ */

function renderDetail(){

  if(!selectedStudent){

    return;

  }


  document
    .getElementById(
      "detailStudent"
    )
    .innerHTML = `

      <div class="student-name">

        ${escapeHtml(
          selectedStudent.name
        )}

      </div>


      <div class="student-meta">

        Student ID:
        <b>
          ${escapeHtml(
            selectedStudent.id
          )}
        </b>

        <br>

        Grade:
        <b>
          ${escapeHtml(
            selectedStudent.grade
          )}
        </b>

        <br>

        Homeroom:
        <b>
          ${escapeHtml(
            selectedStudent.room
          )}
        </b>

      </div>


      <span class="badge">
        ${selectedStudent.active
          ?
          "ACTIVE"
          :
          "INACTIVE"
        }
      </span>

    `;


  renderDetailTimeline();

}



/* ================================================
   DETAIL TIMELINE
================================================ */

function renderDetailTimeline(){

  const container =
    document.getElementById(
      "detailTimeline"
    );


  if(!selectedStudent){

    return;

  }


  const list =
    records.filter(
      record =>
        record.studentId
          ===
        selectedStudent.id
    );


  if(!list.length){

    container.innerHTML = `

      <div class="empty">
        No activity recorded.
      </div>

    `;

    return;

  }


  container.innerHTML =
    list
      .map(
        record => `

          <div class="event">

            <div class="event-title">

              ${escapeHtml(
                record.action
              )}

            </div>


            ${
              record.detail
              ?
              `
              <div class="event-detail">

                ${escapeHtml(
                  record.detail
                )}

              </div>
              `
              :
              ""
            }


            <div class="event-time">

              ${time(
                record.timestamp
              )}

            </div>

          </div>

        `
      )
      .join("");

}

/* ================================================

================================================ */

function renderStudentTable(){

  const query =
    studentSearch.value;


  const list =
    query
    ?
    findStudents(
      query
    )
    :
    students;


  const container =
    document.getElementById(
      "studentTable"
    );


  if(!list.length){

    container.innerHTML = `

      <div class="empty">
        No students found.
      </div>

    `;

    return;

  }


  container.innerHTML = `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>
              ID
            </th>

            <th>
              Name
            </th>

            <th>
              Grade
            </th>

            <th>
              Room
            </th>

            <th>
              Status
            </th>

            <th>
              Action
            </th>

          </tr>

        </thead>


        <tbody>

          ${list
            .map(
              student => `

                <tr>

                  <td>
                    ${escapeHtml(
                      student.id
                    )}
                  </td>

                  <td>
                    ${escapeHtml(
                      student.name
                    )}
                  </td>

                  <td>
                    ${escapeHtml(
                      student.grade
                    )}
                  </td>

                  <td>
                    ${escapeHtml(
                      student.room
                    )}
                  </td>

                  <td>
                    ${student.active
                      ?
                      "Active"
                      :
                      "Inactive"
                    }
                  </td>

                  <td>

                    <button
                      class="blue"
                      style="width:auto;margin:0"
                      data-open-student="${escapeHtml(
                        student.id
                      )}"
                    >
                      OPEN
                    </button>

                  </td>

                </tr>

              `
            )
            .join("")}

        </tbody>

      </table>

    </div>

  `;


  container
    .querySelectorAll(
      "[data-open-student]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            selectStudent(
              button.dataset.openStudent
            );

          }
        );

      }
    );

}



/* ================================================
   ADD STUDENT
================================================ */

document
  .getElementById(
    "newStudentButton"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "studentFormCard"
        )
        .classList.remove(
          "hidden"
        );


      document
        .getElementById(
          "newStudentId"
        )
        .focus();

  );



document
  .getElementById(
    "cancelStudent"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "studentFormCard"
        )
        .classList.add(
          "hidden"
        );

    }
  );



document
  .getElementById(
    "saveStudent"
  )
  .addEventListener(
    "click",
    () => {

      const id =
        document
          .getElementById(
            "newStudentId"
          )
          .value
          .trim();


      const name =
        document
          .getElementById(
            "newStudentName"
          )
          .value
          .trim();


      const grade =
        document
          .getElementById(
            "newStudentGrade"
          )
          .value
          .trim();


      const room =
        document
          .getElementById(
            "newStudentRoom"
          )
          .value
          .trim();


      if(
        !id ||
        !name
      ){

        alert(
          "Student ID and name are required."
        );

        return;

      }


      if(
        students.some(
          student =>
            student.id === id
        )
      ){

        alert(
          "That Student ID already exists."
        );

        return;

      }


      const student = {

        id,

        name,

        grade,

        room,

        active:true

      };


      students.push(
        student
      );


      auditLog(
        "Student Created",
        student
      );


      save();


      document
        .getElementById(
          "newStudentId"
        )
        .value = "";

      document
        .getElementById(
          "newStudentName"
        )
        .value = "";

      document
        .getElementById(
          "newStudentGrade"
        )
        .value = "";

      document
        .getElementById(
          "newStudentRoom"
        )
        .value = "";


      document
        .getElementById(
          "studentFormCard"
        )
        .classList.add(
          "hidden"
        );


      renderStudentTable();

      refreshAll();

    }
  );

/* ================================================
   ACTIVE PASSES
================================================ */

function renderActivePasses(){

  const movements =
    records.filter(
      record =>
        record.category ===
        "Movement"
    );


  const active = [];


  movements.forEach(
    movement => {

      const returned =
        records.some(
          record =>

            record.studentId ===
              movement.studentId

            &&

            record.action ===
              "Return to Class"

            &&

            new Date(
              record.timestamp
            ) >

            new Date(
              movement.timestamp
            )

        );


      if(!returned){

        active.push(
          movement
        );

      }

    }
  );


  const container =
    document.getElementById(
      "activePasses"
    );


  if(!active.length){

    container.innerHTML = `

      <div class="empty">
        No students are currently out.
      </div>

    `;

    return;

  }


  container.innerHTML = `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>
              Student
            </th>

            <th>
              Destination
            </th>

            <th>
              Started
            </th>

          </tr>

        </thead>


        <tbody>

          ${active
            .map(
              record => `

                <tr>

                  <td>
                    ${escapeHtml(
                      record.studentName
                    )}
                  </td>

                  <td>
                    ${escapeHtml(
                      record.detail
                    )}
                  </td>

                  <td>
                    ${time(
                      record.timestamp
                    )}
                  </td>

                </tr>

              `
            )
            .join("")}

        </tbody>

      </table>

    </div>

  `;

}

function renderRecentActivity(){

  const container =
    document.getElementById(
      "recentActivity"
    );


  const list =
    audit.slice(
      0,
      10
    );


  if(!list.length){

    container.innerHTML = `

      <div class="empty">
        No activity yet.
      </div>

    `;

    return;

  }


  container.innerHTML =
    list
      .map(
        item => `

          <div class="event">

            <div class="event-title">

              ${escapeHtml(
                item.action
              )}

            </div>


            ${
              item.studentName
              ?
              `
              <div class="event-detail">

                ${escapeHtml(
                  item.studentName
                )}

                ${
                  item.detail
                  ?
                  " — " +
                  escapeHtml(
                    item.detail
                  )
                  :
                  ""
                }

              `
              :
              ""
            }


            <div class="event-time">

              ${time(
                item.timestamp
              )}

            </div>

          </div>

        `
      )
      .join("");

}



/* ================================================
   DASHBOARD
================================================ */

function renderDashboard(){

  const todayRecords =
    records.filter(
      record =>
        isToday(
          record.timestamp
        )
    );


  const present =
    todayRecords.filter(
      record =>
        record.category ===
        "Attendance"
        &&
        record.action ===
        "Present"
    ).length;


  const absent =
    todayRecords.filter(
      record =>
        record.category ===
        "Attendance"
        &&
        record.action ===
        "Absent"
    ).length;


  const tardy =
    todayRecords.filter(
      record =>
        record.category ===
        "Attendance"
        &&
        record.action ===
        "Tardy"
    ).length;


  const movements =
    records.filter(
      record =>
        record.category ===
        "Movement"
    );


  const returns =
    records.filter(
      record =>
        record.action ===
        "Return to Class"
    );


  let out = 0;


  movements.forEach(
    movement => {

      const returned =
        returns.some(
          record =>

            record.studentId ===
              movement.studentId

            &&

            new Date(
              record.timestamp
            ) >

            new Date(
              movement.timestamp
            )

        );


      if(!returned){

        out++;

      }

    }
  );


  const discipline =
    todayRecords.filter(
      record =>
        record.category ===
        "Discipline"
    ).length;


  document
    .getElementById(
      "statStudents"
    )
    .textContent =
      students.length;


  document
    .getElementById(
      "statPresent"
    )
    .textContent =
      present;


  document
    .getElementById(
      "statAbsent"
    )
    .textContent =
      absent;


  document
    .getElementById(
      "statTardy"
    )
    .textContent =
      tardy;


  document
    .getElementById(
      "statOut"
    )
    .textContent =
      out;


  document
    .getElementById(
      "statDiscipline"
    )
    .textContent =
      discipline;

}
