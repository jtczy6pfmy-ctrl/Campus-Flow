<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Campus Flow">

<meta name="theme-color" content="#111827">

<title>Campus Flow</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  color-scheme:light dark;

  --bg:#eef1f5;
  --card:#ffffff;
  --border:#dce2e8;
  --text:#17202a;
  --muted:#68727d;

  --input:#ffffff;
  --input-border:#c8ced6;

  --primary:#111827;
  --primary-text:#ffffff;

  --secondary:#e7ebef;
  --secondary-text:#17202a;

  --blue:#2563eb;
  --green:#16834b;
  --orange:#c56a00;
  --red:#b42318;
  --purple:#6d3fc0;

  --shadow:0 5px 20px rgba(15,23,42,.08);
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  -webkit-font-smoothing:antialiased;
}

header{
  background:linear-gradient(
    180deg,
    #18202c 0%,
    #0b1017 100%
  );

  color:white;

  padding:
    calc(18px + env(safe-area-inset-top))
    18px
    18px;

  text-align:center;

  font-size:25px;
  font-weight:800;

  box-shadow:
    0 2px 12px rgba(0,0,0,.18);

  position:sticky;
  top:0;
  z-index:50;
}

.app{
  width:min(1100px,100%);
  margin:auto;

  padding:
    16px
    14px
    calc(50px + env(safe-area-inset-bottom));
}


/* DASHBOARD */

.dashboard-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:12px;

  margin-bottom:16px;
}

.stat{
  background:var(--card);

  border:
    1px solid
    var(--border);

  border-radius:15px;

  padding:15px;

  box-shadow:var(--shadow);
}

.stat-label{
  color:var(--muted);

  font-size:12px;
  font-weight:700;

  text-transform:uppercase;

  letter-spacing:.04em;
}

.stat-value{
  margin-top:5px;

  font-size:27px;
  font-weight:850;
}


/* CARDS */

.card{
  background:var(--card);

  border:
    1px solid
    var(--border);

  border-radius:16px;

  padding:19px;

  margin-bottom:16px;

  box-shadow:var(--shadow);
}

.card h2{
  margin:
    0
    0
    17px;

  font-size:20px;
  font-weight:800;

  display:flex;
  align-items:center;
  gap:9px;
}

.card h2::before{
  content:"";

  width:4px;
  height:21px;

  border-radius:4px;

  background:var(--primary);
}


/* SEARCH */

.search-row{
  display:grid;

  grid-template-columns:
    1fr
    180px;

  gap:10px;
}

label{
  display:block;

  margin:
    12px
    0
    6px;

  font-size:13px;
  font-weight:750;
}

input,
select,
textarea{
  width:100%;

  padding:13px 14px;

  border:
    1px solid
    var(--input-border);

  border-radius:10px;

  background:var(--input);
  color:var(--text);

  font-family:inherit;
  font-size:16px;

  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#64748b;

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.12);
}

textarea{
  min-height:110px;
  resize:vertical;
}


/* BUTTONS */

button{
  width:100%;

  border:0;

  border-radius:10px;

  padding:13px 15px;

  min-height:48px;

  margin-top:10px;

  background:var(--primary);
  color:var(--primary-text);

  font-family:inherit;

  font-size:15px;
  font-weight:800;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;

  transition:
    transform .08s ease,
    opacity .15s ease;
}

button:active{
  transform:scale(.985);
}

button.secondary{
  background:var(--secondary);
  color:var(--secondary-text);
}

button.blue{
  background:var(--blue);
}

button.green{
  background:var(--green);
}

button.orange{
  background:var(--orange);
}

button.red{
  background:var(--red);
}

button.purple{
  background:var(--purple);
}


/* STUDENT */

.student-layout{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:16px;
}

.student-name{
  font-size:25px;
  font-weight:850;

  margin-bottom:8px;
}

.student-meta{
  color:var(--muted);

  font-size:15px;

  line-height:1.6;
}

.badges{
  margin-top:12px;
}

.badge{
  display:inline-block;

  padding:
    5px
    9px;

  margin:
    3px
    3px
    0
    0;

  border-radius:999px;

  background:var(--secondary);

  font-size:12px;
  font-weight:750;
}


/* QUICK ACTIONS */

.action-grid{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;
}

.action-grid button{
  margin-top:0;
}


/* TIMELINE */

.timeline{
  position:relative;

  margin-top:5px;

  padding-left:22px;
}

.timeline::before{
  content:"";

  position:absolute;

  left:6px;
  top:5px;
  bottom:5px;

  width:2px;

  background:
    var(--border);
}

.event{
  position:relative;

  background:
    color-mix(
      in srgb,
      var(--secondary) 65%,
      transparent
    );

  border-radius:11px;

  padding:11px 13px;

  margin-bottom:10px;
}

.event::before{
  content:"";

  position:absolute;

  left:-20px;
  top:17px;

  width:10px;
  height:10px;

  border-radius:50%;

  background:var(--blue);

  border:
    2px solid
    var(--card);
}

.event-title{
  font-weight:800;
}

.event-detail{
  margin-top:3px;

  font-size:14px;

  color:var(--muted);
}

.event-time{
  margin-top:5px;

  font-size:12px;

  color:var(--muted);
}


/* EMPTY */

.empty{
  color:var(--muted);

  text-align:center;

  padding:22px 10px;

  font-size:14px;
}


/* HIDDEN */

.hidden{
  display:none !important;
}


/* MOBILE */

@media(max-width:760px){

  .dashboard-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .student-layout{
    grid-template-columns:1fr;
  }

  .search-row{
    grid-template-columns:1fr;
  }

}

@media(max-width:520px){

  .app{
    padding:
      12px
      10px
      40px;
  }

  .card{
    padding:16px;
    border-radius:15px;
  }

  header{
    font-size:22px;
  }

  .action-grid{
    grid-template-columns:1fr;
  }

}


/* DARK MODE */

@media(prefers-color-scheme:dark){

  :root{

    --bg:#0b0f14;
    --card:#171d24;

    --border:#2c3540;

    --text:#f4f6f8;
    --muted:#a7b0ba;

    --input:#0f141a;
    --input-border:#3b4550;

    --primary:#f4f6f8;
    --primary-text:#11161c;

    --secondary:#29323c;
    --secondary-text:#f4f6f8;

  }

  header{
    background:#000;
  }

}

</style>
</head>


<body>


<header>
  Campus Flow
</header>


<main class="app">


<!-- DASHBOARD -->

<section class="dashboard-grid">

  <div class="stat">

    <div class="stat-label">
      Students
    </div>

    <div
      class="stat-value"
      id="statStudents"
    >
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-label">
      Present
    </div>

    <div
      class="stat-value"
      id="statPresent"
    >
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-label">
      Active Passes
    </div>

    <div
      class="stat-value"
      id="statPasses"
    >
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-label">
      Discipline
    </div>

    <div
      class="stat-value"
      id="statDiscipline"
    >
      0
    </div>

  </div>

</section>



<!-- STUDENT LOOKUP -->

<section class="card">

  <h2>
    Student Lookup
  </h2>


  <div class="search-row">

    <div>

      <label for="studentId">
        Student ID / Barcode
      </label>

      <input
        id="studentId"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Scan or enter student ID"
      >

    </div>


    <div>

      <label>
        Action
      </label>

      <button
        id="lookupButton"
        class="blue"
      >
        LOOK UP STUDENT
      </button>

    </div>

  </div>

</section>



<!-- STUDENT INFORMATION -->

<section
  class="student-layout hidden"
  id="studentArea"
>


<!-- STUDENT RECORD -->

<section class="card">

  <h2>
    Student Record
  </h2>

  <div
    id="studentRecord"
  ></div>

</section>


<!-- QUICK STATUS -->

<section class="card">

  <h2>
    Current Status
  </h2>

  <div
    id="currentStatus"
    class="empty"
  >
    No status recorded.
  </div>

</section>

</section>



<!-- MOVEMENT -->

<section
  class="card hidden"
  id="movementCard"
>

  <h2>
    Student Movement
  </h2>


  <label for="destination">
    Destination
  </label>

  <select id="destination">

    <option>
      Classroom
    </option>

    <option>
      Restroom
    </option>

    <option>
      Lunch
    </option>

    <option>
      Office
    </option>

    <option>
      Nurse
    </option>

    <option>
      Library
    </option>

    <option>
      Other
    </option>

  </select>


  <button
    class="blue"
    id="movementButton"
  >
    RECORD MOVEMENT
  </button>

</section>



<!-- ATTENDANCE -->

<section
  class="card hidden"
  id="attendanceCard"
>

  <h2>
    Attendance
  </h2>


  <div class="action-grid">

    <button
      class="green"
      data-action="Present"
    >
      PRESENT
    </button>


    <button
      class="orange"
      data-action="Tardy"
    >
      TARDY
    </button>


    <button
      class="red"
      data-action="Absent"
    >
      ABSENT
    </button>


    <button
      class="secondary"
      data-action="Early Dismissal"
    >
      EARLY DISMISSAL
    </button>

  </div>

</section>



<!-- DISCIPLINE -->

<section
  class="card hidden"
  id="disciplineCard"
>

  <h2>
    Discipline
  </h2>


  <div class="action-grid">

    <button
      class="orange"
      data-action="Detention"
    >
      DETENTION
    </button>


    <button
      class="red"
      data-action="ISS"
    >
      ISS
    </button>


    <button
      class="red"
      data-action="OSS"
    >
      OSS
    </button>


    <button
      class="secondary"
      data-action="Discipline Note"
    >
      DISCIPLINE NOTE
    </button>

  </div>

</section>



<!-- NOTES -->

<section
  class="card hidden"
  id="notesCard"
>

  <h2>
    Staff Notes
  </h2>


  <textarea
    id="staffNote"
    placeholder="Enter a note about this student..."
  ></textarea>


  <button
    id="saveNote"
  >
    SAVE NOTE
  </button>

</section>



<!-- ACTIVITY -->

<section
  class="card hidden"
  id="activityCard"
>

  <h2>
    Student Activity
  </h2>


  <div
    id="timeline"
    class="timeline"
  ></div>

</section>


</main>



<script>

"use strict";


/*
  CAMPUS FLOW
  VERSION 2
*/


/* DEMO STUDENTS */

const students = {

  "100001":{
    id:"100001",
    name:"Alex Johnson",
    grade:"8",
    homeroom:"204"
  },

  "100002":{
    id:"100002",
    name:"Jordan Smith",
    grade:"10",
    homeroom:"112"
  },

  "100003":{
    id:"100003",
    name:"Taylor Brown",
    grade:"6",
    homeroom:"301"
  }

};


/* APPLICATION STATE */

let currentStudent = null;

let events = [];



/* DOM */

const studentId =
  document.getElementById(
    "studentId"
  );

const lookupButton =
  document.getElementById(
    "lookupButton"
  );

const studentArea =
  document.getElementById(
    "studentArea"
  );

const movementCard =
  document.getElementById(
    "movementCard"
  );

const attendanceCard =
  document.getElementById(
    "attendanceCard"
  );

const disciplineCard =
  document.getElementById(
    "disciplineCard"
  );

const notesCard =
  document.getElementById(
    "notesCard"
  );

const activityCard =
  document.getElementById(
    "activityCard"
  );

const studentRecord =
  document.getElementById(
    "studentRecord"
  );

const currentStatus =
  document.getElementById(
    "currentStatus"
  );

const timeline =
  document.getElementById(
    "timeline"
  );



/* LOOKUP */

function lookupStudent(){

  const id =
    studentId.value.trim();


  if(!id){

    alert(
      "Scan or enter a student ID."
    );

    studentId.focus();

    return;

  }


  if(
    students[id]
  ){

    currentStudent =
      students[id];

  }else{

    /*
      Demo behavior.

      Later this becomes
      a SQL/database lookup.
    */

    currentStudent = {

      id:id,

      name:
        "Student " + id,

      grade:"—",

      homeroom:"—"

    };

  }


  showStudent();

}



/* SHOW STUDENT */

function showStudent(){

  studentArea.classList.remove(
    "hidden"
  );

  movementCard.classList.remove(
    "hidden"
  );

  attendanceCard.classList.remove(
    "hidden"
  );

  disciplineCard.classList.remove(
    "hidden"
  );

  notesCard.classList.remove(
    "hidden"
  );

  activityCard.classList.remove(
    "hidden"
  );


  studentRecord.innerHTML = `

    <div class="student-name">

      ${escapeHtml(
        currentStudent.name
      )}

    </div>

    <div class="student-meta">

      Student ID:
      <b>
        ${escapeHtml(
          currentStudent.id
        )}
      </b>

      <br>

      Grade:
      <b>
        ${escapeHtml(
          currentStudent.grade
        )}
      </b>

      <br>

      Homeroom:
      <b>
        ${escapeHtml(
          currentStudent.homeroom
        )}
      </b>

    </div>

    <div class="badges">

      <span class="badge">
        ACTIVE
      </span>

      <span class="badge">
        STUDENT
      </span>

    </div>

  `;


  renderTimeline();

  updateStatus();

  studentId.blur();

}



/* ADD EVENT */

function addEvent(
  action,
  detail = ""
){

  if(!currentStudent){

    alert(
      "Look up a student first."
    );

    return;

  }


  events.unshift({

    studentId:
      currentStudent.id,

    studentName:
      currentStudent.name,

    action,

    detail,

    timestamp:
      new Date()

  });


  renderTimeline();

  updateStatus();

  updateDashboard();

}



/* MOVEMENT */

function recordMovement(){

  const destination =
    document.getElementById(
      "destination"
    ).value;


  addEvent(
    "Movement",
    "Student moved to " +
    destination
  );

}



/* ACTION BUTTONS */

document
  .querySelectorAll(
    "[data-action]"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        addEvent(
          button.dataset.action
        );

      }
    );

  });



/* NOTE */

document
  .getElementById(
    "saveNote"
  )
  .addEventListener(
    "click",
    () => {

      const note =
        document
          .getElementById(
            "staffNote"
          )
          .value
          .trim();


      if(!note){

        alert(
          "Enter a note first."
        );

        return;

      }


      addEvent(
        "Staff Note",
        note
      );


      document
        .getElementById(
          "staffNote"
        )
        .value = "";

    }
  );



/* TIMELINE */

function renderTimeline(){

  const studentEvents =
    events.filter(
      event =>
        currentStudent &&
        event.studentId ===
        currentStudent.id
    );


  if(
    !studentEvents.length
  ){

    timeline.innerHTML = `

      <div class="empty">

        No activity recorded
        for this student today.

      </div>

    `;

    return;

  }


  timeline.innerHTML =
    studentEvents
      .map(event => {

        const time =
          event.timestamp
            .toLocaleTimeString(
              [],
              {
                hour:"numeric",
                minute:"2-digit"
              }
            );


        return `

          <div class="event">

            <div class="event-title">

              ${escapeHtml(
                event.action
              )}

            </div>


            ${
              event.detail
                ?
                `
                <div class="event-detail">

                  ${escapeHtml(
                    event.detail
                  )}

                </div>
                `
                :
                ""
            }


            <div class="event-time">

              ${time}

            </div>

          </div>

        `;

      })
      .join("");

}



/* STATUS */

function updateStatus(){

  if(!currentStudent){

    currentStatus.textContent =
      "No student selected.";

    return;

  }


  const latest =
    events.find(
      event =>
        event.studentId ===
        currentStudent.id
    );


  if(!latest){

    currentStatus.innerHTML = `

      <span class="badge">

        NO ACTIVE STATUS

      </span>

    `;

    return;

  }


  let text =
    latest.action;


  if(latest.detail){

    text +=
      " — " +
      latest.detail;

  }


  currentStatus.innerHTML = `

    <b>
      ${escapeHtml(text)}
    </b>

  `;

}



/* DASHBOARD */

function updateDashboard(){

  const studentCount =
    Object.keys(
      students
    ).length;


  const presentCount =
    events.filter(
      event =>
        event.action ===
        "Present"
    ).length;


  const passCount =
    events.filter(
      event =>
        event.action ===
        "Movement"
    ).length;


  const disciplineCount =
    events.filter(
      event =>
        [
          "ISS",
          "OSS",
          "Detention",
          "Discipline Note"
        ]
        .includes(
          event.action
        )
    ).length;


  document
    .getElementById(
      "statStudents"
    )
    .textContent =
      studentCount;


  document
    .getElementById(
      "statPresent"
    )
    .textContent =
      presentCount;


  document
    .getElementById(
      "statPasses"
    )
    .textContent =
      passCount;


  document
    .getElementById(
      "statDiscipline"
    )
    .textContent =
      disciplineCount;

}



/* ENTER KEY */

studentId.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Enter"
    ){

      event.preventDefault();

      lookupStudent();

    }

  }
);



/* BUTTONS */

lookupButton.addEventListener(
  "click",
  lookupStudent
);


document
  .getElementById(
    "movementButton"
  )
  .addEventListener(
    "click",
    recordMovement
  );



/* HTML SAFETY */

function escapeHtml(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}



/* START */

updateDashboard();

studentId.focus();

</script>

</body>
</html>
